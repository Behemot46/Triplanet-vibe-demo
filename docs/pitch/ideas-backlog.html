<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a quiet blue header, a short "how to use", a strip of demo screens, then the backlog itself: a dense, Jira-like list the team rates together. */
:root{
  --bg:#f5f7fa; --panel:#ffffff; --ink:#172b4d; --ink2:#44546f; --muted:#626f86; --line:#dfe3ea; --recess:#f1f4f8; --hover:#f7f9fc;
  --primary:#0c66e4; --primary-ink:#0055cc; --night1:#012972; --night2:#0351AB; --mint:#5DFCE0;
  --work:#0055cc; --work-bg:#e9f2ff; --prev:#6e5dc6; --prev-bg:#f3f0ff; --idea:#a54800; --idea-bg:#fff3eb; --none:#626f86; --none-bg:#f1f2f4;
  --p5:#c9372c; --p4:#e2483d; --p3:#d97008; --p2:#1d7afc; --p1:#0c66e4; --win:#1f845a; --win-bg:#dcfff1;
  --e1:#0c66e4; --e2:#6e5dc6; --e3:#1f845a; --e4:#a54800; --e5:#ae2e24;
  --f-display:"Barlow","Arial Narrow",Arial,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a1d; --panel:#1d2125; --ink:#dee4ea; --ink2:#b6c2cf; --muted:#8c9bab; --line:#2c333a; --recess:#22272b; --hover:#22272b;
  --primary:#579dff; --primary-ink:#85b8ff; --work:#85b8ff; --work-bg:#092957; --prev:#b8acf6; --prev-bg:#2b273f; --idea:#fec195; --idea-bg:#3a2617; --none:#8c9bab; --none-bg:#2c333a;
  --p5:#f87168; --p4:#f87168; --p3:#fca700; --p2:#579dff; --p1:#85b8ff; --win:#4bce97; --win-bg:#164b35;
  --e1:#579dff; --e2:#b8acf6; --e3:#4bce97; --e4:#fec195; --e5:#fd9891; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a1d; --panel:#1d2125; --ink:#dee4ea; --ink2:#b6c2cf; --muted:#8c9bab; --line:#2c333a; --recess:#22272b; --hover:#22272b;
  --primary:#579dff; --primary-ink:#85b8ff; --work:#85b8ff; --work-bg:#092957; --prev:#b8acf6; --prev-bg:#2b273f; --idea:#fec195; --idea-bg:#3a2617; --none:#8c9bab; --none-bg:#2c333a;
  --p5:#f87168; --p4:#f87168; --p3:#fca700; --p2:#579dff; --p1:#85b8ff; --win:#4bce97; --win-bg:#164b35;
  --e1:#579dff; --e2:#b8acf6; --e3:#4bce97; --e4:#fec195; --e5:#fd9891; color-scheme:dark}
html[lang="he"]{--f-display:"Heebo",Arial,sans-serif;--f-body:"Heebo",system-ui,Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--primary-ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(24px,3vw,30px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:4px;vertical-align:middle;background:var(--idea-bg);color:var(--idea)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
/* header */
.top{background:linear-gradient(135deg,var(--night1),var(--night2));color:#eaf3ff;padding-block:44px 38px}
.top .wrap{display:grid;gap:16px;position:relative}
.top .eyebrow{color:var(--mint);padding-inline-end:110px}
.top h1{font-size:clamp(34px,5.4vw,56px);font-weight:700;color:#fff}
.top .lede{color:#d3e4ff;font-size:17px;max-width:68ch}
.lang{position:absolute;inset-inline-end:max(16px,env(safe-area-inset-right,0px));top:0;font:600 14px/1 var(--f-body);padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 var(--f-body);padding:11px 16px;border-radius:10px;border:1px solid transparent;text-decoration:none;cursor:pointer}
.btn.mint{background:var(--mint);color:var(--night1)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13.5px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 12px}
.facts b{font-family:var(--f-display);font-size:15px}
/* how */
.how{padding-block:28px 8px}
.how .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how .c{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;align-items:start}
.how .c i{grid-row:1/3;font-style:normal;font-family:var(--f-display);font-weight:700;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--work-bg);color:var(--work)}
.how .c p{font-size:14.5px;color:var(--ink2)}
.how .fine{font-size:13.5px;color:var(--muted);margin-top:12px;max-width:90ch}
/* gallery */
.gal{padding-block:20px 8px}
.strip{display:grid;grid-template-columns:2.2fr repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.shot{margin:0;display:grid;gap:5px;min-width:0}
.shot img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.shot figcaption{font-size:12.5px;color:var(--muted);line-height:1.35}
.shot figcaption b{color:var(--ink)}
/* backlog */
.bl{padding-block:28px 56px}
.blh{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.prog{font-size:14px;color:var(--ink2)}
.prog b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--recess);overflow:hidden;width:220px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--win);border-radius:99px;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:2px}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lh{display:grid;grid-template-columns:72px minmax(0,1fr) 116px 150px 150px 112px 28px;gap:12px;align-items:center;padding:9px 14px;background:var(--recess);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.it{border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.rw{display:grid;grid-template-columns:72px minmax(0,1fr) 116px 150px 150px 112px 28px;gap:12px;align-items:center;padding:10px 14px}
.rw:hover{background:var(--hover)}
.key{font:500 12.5px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.ti{min-width:0;display:grid;gap:3px}
.ti b{font-weight:600;line-height:1.3}
.ti .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ep{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2)}
.ep i{width:8px;height:8px;border-radius:2px;flex:none}
.win{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--win-bg);color:var(--win)}
.lz{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.lz.work{background:var(--work-bg);color:var(--work)}.lz.prev{background:var(--prev-bg);color:var(--prev)}.lz.idea{background:var(--idea-bg);color:var(--idea)}
.lz.none,.lz.unk{background:var(--none-bg);color:var(--none)}
.team{display:flex;align-items:center;gap:7px;min-width:0;font-size:13.5px}
.team .pl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.pico{width:16px;height:16px;flex:none}
.mine{display:contents}
.mp,.ms{display:block;min-width:0}
.mine select{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13.5px}
.mine select.set{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.exp{width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.exp:hover{background:var(--recess)}
.exp svg{transition:transform .2s}
.it.open .exp svg{transform:rotate(180deg)}
.det{display:none;padding:4px 14px 16px calc(14px + 72px + 12px);gap:12px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
html[dir="rtl"] .det{padding:4px calc(14px + 72px + 12px) 16px 14px}
.it.open .det{display:grid}
.det dl{margin:0;display:grid;gap:8px}
.det dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.det dd{margin:0;color:var(--ink2);font-size:14.5px}
.det .who{background:var(--recess);border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start;font-size:13.5px}
.det .who ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.det .who li{display:flex;justify-content:space-between;gap:10px}
.det .who li span:last-child{color:var(--muted);white-space:nowrap}
.cmt{justify-self:start;font:600 13px/1 var(--f-body);padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.state{font-size:13.5px;color:var(--muted);margin-top:10px}
.next{padding-block:8px 48px}
.next .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;max-width:820px}
.next .card p{color:var(--ink2)}
footer{padding-block:26px 40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{display:grid;gap:6px}
@media (max-width:980px){
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip .shot:first-child{grid-column:1/-1}
  .how .grid3{grid-template-columns:1fr}
  .lh{display:none}
  .rw{grid-template-columns:auto minmax(0,1fr) 28px;grid-template-areas:"k t x" "s s s" "tm tm tm" "m m m";row-gap:8px}
  .rw .key{grid-area:k}.rw .ti{grid-area:t}.rw .exp{grid-area:x}.rw .dz{grid-area:s}.rw .team{grid-area:tm}
  .rw .mine{grid-area:m;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rw .mp,.rw .ms{display:contents}
  .det,html[dir="rtl"] .det{padding:4px 14px 16px;grid-template-columns:1fr}
  .lab{display:inline!important}
}
.lab{display:none;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-inline-end:6px}
</style>

  ['As a tour director, I want today\'s stops, the passenger list with medical and dietary flags, and the vouchers on my phone, so the day runs without paper.','כמדריך טיול, אני רוצה לראות בטלפון את התחנות של היום, את רשימת הנוסעים עם התראות רפואיות ותזונה, ואת השוברים, כדי לנהל את היום בלי ניירת.'],
  ['Up-to-date information on the road, without printed packs.','מידע עדכני בשטח, בלי חבילות מודפסות.'],
  ['View as > Suppliers and field > Tour director','לצפות בתור > ספקים ושטח > מדריך']],
 ['TP-501','insight','work','none',['A home screen for each role','מסך בית לכל תפקיד'],
  ['As an owner, accountant, operations coordinator or agent, I want a home screen with my own figures and next steps, so the day starts with what matters.','כבעלים, מנהלת חשבונות, רכזת תפעול או סוכן, אני רוצה מסך בית עם המספרים והצעדים שלי, כדי להתחיל את היום ממה שחשוב.'],
  ['Each role looks at the business differently.','כל תפקיד מסתכל על העסק אחרת.'],
  ['View as each member of the team','לצפות בתור כל אחד מאנשי הצוות']],
 ['TP-502','insight','work','none',['Maya, answers from the agency data','מאיה, עוזרת שעונה מהנתונים'],
  ['As an owner, I want to ask a question in plain words (which supplier overbills most?) and get an answer from my own data.','כבעלת סוכנות, אני רוצה לשאול שאלה במילים פשוטות (איזה ספק מחייב הכי הרבה ביתר?) ולקבל תשובה מהנתונים שלי.'],
  ['It shows the AI side of the product in a practical way.','זה מראה את הצד של הבינה המלאכותית במוצר בצורה מעשית.'],
  ['The Maya button on every screen','הכפתור של מאיה בכל מסך']],
 ['TP-503','insight','work','none',['A spoken morning brief','סיכום בוקר מוקרא'],
  ['As an owner, I want to hear a one-minute brief on the season and what is urgent today, so I am up to date on the way to the office.','כבעלת סוכנות, אני רוצה לשמוע סיכום של דקה על מצב העונה ועל מה שדחוף היום, כדי להתעדכן כבר בדרך למשרד.'],
  ['Convenient, and built on figures the home screen already has.','נוח, ונבנה מהמספרים שכבר יש במסך הבית.'],
  ['The owner\'s home > Listen to the brief (Chrome or the Claude app)','מסך הבית של הבעלים > להאזין לסיכום (ב-Chrome או באפליקציית Claude)']]];

/* ---------- state ---------- */
let LANG='he';try{const sv=localStorage.getItem('backlog-lang');if(sv==='en'||sv==='he')LANG=sv;}catch(e){}
const X=a=>a[LANG==='he'?1:0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let my={},all={},names={},meId=null,db=null,user=null,live=false,ro=false,saving=false,pending=false;
let q='',epic='all',onlyMine=false,onlyWin=false,sortBy='team',open=new Set(),stKey='',stTimer=null;
const EP=Object.fromEntries(EPICS.map(e=>[e[0],e]));
/* team aggregate per item (my unsaved choice counts as mine) */
function agg(k){const rs=[];Object.entries(all).forEach(([id,r])=>{if(id!==meId&&r&&r[k]&&r[k].p)rs.push({id,...r[k]});});
  if(my[k]&&my[k].p)rs.push({id:meId||'me',...my[k]});
  const n=rs.length,p=n?rs.reduce((a,x)=>a+x.p,0)/n:0,ss=rs.filter(x=>x.s),s=ss.length?ss.reduce((a,x)=>a+x.s,0)/ss.length:0;
  return {n,p,s,rs,win:n>0&&p>=3.5&&s>0&&s<=2};}
const priLabel=p=>{const r=Math.round(p);const x=PRI.find(z=>z[0]===r);return x?(LANG==='he'?x[2]:x[1]):'';};
function pico(p){const r=Math.round(p),c=r>=5?'--p5':r===4?'--p4':r===3?'--p3':r===2?'--p2':'--p1';
  const up=r>=4,eq=r===3,dbl=r===5||r===1;
  const path=eq?'<path d="M3 6h10M3 10h10" stroke-width="2" stroke-linecap="round"/>':
    (up?`<path d="M3 ${dbl?9:10}l5-5 5 5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dbl?'<path d="M3 13l5-5 5 5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}`:
         `<path d="M3 ${dbl?3:6}l5 5 5-5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dbl?'<path d="M3 7l5 5 5-5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}`);
  return `<svg class="pico" viewBox="0 0 16 16" aria-hidden="true" style="stroke:var(${c})">${path}</svg>`;}
const chev='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- render ---------- */
function staticText(){
  const r=document.documentElement;r.lang=LANG;r.dir=LANG==='he'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>{const v=T[e.dataset.t];if(v)e.innerHTML=X(v);});
  const b=document.getElementById('lang');b.textContent=LANG==='he'?'English':'עברית';b.lang=LANG==='he'?'en':'he';
  const nW=ITEMS.filter(i=>i[2]==='work').length,nP=ITEMS.filter(i=>i[2]==='prev').length,nI=ITEMS.filter(i=>i[2]==='idea').length;
  document.getElementById('facts').innerHTML=LANG==='he'
    ?`<span><b>${ITEMS.length}</b> פריטים</span><span><b>${EPICS.length}</b> תחומים</span><span><b>${nW}</b> עובדים בדמו</span><span><b>${nP}</b> תצוגות מקדימות</span><span><b>${nI}</b> רעיונות</span>`
    :`<span><b>${ITEMS.length}</b> items</span><span><b>${EPICS.length}</b> areas</span><span><b>${nW}</b> working in the demo</span><span><b>${nP}</b> clickable previews</span><span><b>${nI}</b> ideas</span>`;
  const qi=document.getElementById('q');qi.placeholder=X(UI.search);qi.setAttribute('aria-label',X(UI.search));
  document.getElementById('sort').innerHTML=[['team',UI.s_team],['key',UI.s_key],['epic',UI.s_epic]].map(([v,l])=>`<option value="${v}" ${v===sortBy?'selected':''}>${X(l)}</option>`).join('');
  document.querySelector('.strip').querySelectorAll('img').forEach((im,i)=>{im.alt=document.querySelectorAll('.strip figcaption')[i].textContent;});
}
function drawEpics(){const c=e=>ITEMS.filter(i=>e==='all'||i[1]===e).length;
  document.getElementById('epics').innerHTML=`<button class="chip" data-ep="all" aria-pressed="${epic==='all'}">${X(UI.all)} <span class="n">${c('all')}</span></button>`+
    EPICS.map(e=>`<button class="chip" data-ep="${e[0]}" aria-pressed="${epic===e[0]}"><i class="dot" style="background:var(${e[2]})"></i>${X(e[1])} <span class="n">${c(e[0])}</span></button>`).join('');}
function draw(){
  const ql=q.trim().toLowerCase();
  let rows=ITEMS.filter(i=>(epic==='all'||i[1]===epic)&&(!onlyMine||!(my[i[0]]&&my[i[0]].p))&&
    (!ql||[i[0],...i[4],...i[5],...i[6],...i[7]].join(' ').toLowerCase().includes(ql)));
  const A=Object.fromEntries(ITEMS.map(i=>[i[0],agg(i[0])]));
  if(onlyWin)rows=rows.filter(i=>A[i[0]].win);
  const eo=Object.fromEntries(EPICS.map((e,ix)=>[e[0],ix]));
  rows.sort((a,b)=>sortBy==='key'?a[0].localeCompare(b[0]):sortBy==='epic'?(eo[a[1]]-eo[b[1]]||a[0].localeCompare(b[0])):
    ((A[b[0]].p-A[a[0]].p)||(A[b[0]].n-A[a[0]].n)||a[0].localeCompare(b[0])));
  const lp=X(UI.lp),ls=X(UI.ls);
  document.getElementById('items').innerHTML=rows.length?rows.map(i=>{const k=i[0],a=A[k],m=my[k]||{},e=EP[i[1]],op=open.has(k);
    const team=a.n?`${pico(a.p)}<span class="pl">${priLabel(a.p)}</span><span class="cnt">· ${X(UI.rated(a.n))}</span>`:`<span class="cnt">${X(UI.none)}</span>`;
    const who=a.rs.length?`<ul>${a.rs.sort((x,y)=>y.p-x.p).map(r=>`<li><span>${esc(r.id===meId||r.id==='me'?X(UI.me):(names[r.id]||'…'))}</span><span>${priLabel(r.p)}${r.s?' · '+SIZE[r.s-1][LANG==='he'?2:1].split(' · ')[0]:''}</span></li>`).join('')}</ul>`:`<p>${X(UI.nobody)}</p>`;
    return `<div class="it${op?' open':''}" id="it-${k}" role="listitem">
     <div class="rw"><span class="key">${k}</span>
      <div class="ti"><b>${esc(X(i[4]))}</b><span class="meta"><span class="ep"><i style="background:var(${e[2]})"></i>${esc(X(e[1]))}</span>${a.win?`<span class="win">${X(UI.win)}</span>`:''}</span></div>
      <span class="dz"><span class="lab">${X(T.c_demo)}</span><span class="lz ${i[2]}">${X(DST[i[2]])}</span></span>
      <span class="team"><span class="lab">${X(T.c_team)}</span>${team}</span>
      <span class="mine"><span class="mp"><select data-k="${k}" data-f="p" aria-label="${esc(lp+': '+X(i[4]))}" class="${m.p?'set':''}" ${ro?'disabled':''}><option value="0">${lp} …</option>${PRI.map(p=>`<option value="${p[0]}" ${m.p===p[0]?'selected':''}>${LANG==='he'?p[2]:p[1]}</option>`).join('')}</select></span>
       <span class="ms"><select data-k="${k}" data-f="s" aria-label="${esc(ls+': '+X(i[4]))}" class="${m.s?'set':''}" ${ro?'disabled':''}><option value="0">${ls} …</option>${SIZE.map(s=>`<option value="${s[0]}" ${m.s===s[0]?'selected':''}>${LANG==='he'?s[2]:s[1]}</option>`).join('')}</select></span></span>
      <button class="exp" data-x="${k}" aria-expanded="${op}" aria-label="${esc(X(UI.open)+': '+X(i[4]))}">${chev}</button></div>
     <div class="det"><dl><div><dt>${X(UI.story)}</dt><dd>${esc(X(i[5]))}</dd></div><div><dt>${X(UI.why)}</dt><dd>${esc(X(i[6]))}</dd></div>
       <div><dt>${X(UI.where)}</dt><dd>${esc(X(i[7]))}</dd></div><div><dt>${X(UI.prod)}</dt><dd>${X(PST[i[3]])} <span class="tag">${LANG==='he'?'לא מאומת':'unverified'}</span></dd></div></dl>
      <div class="who"><b>${X(UI.who)}</b>${who}<button class="cmt" data-cmt="it-${k}">${X(UI.comment)}</button></div></div></div>`;}).join(''):`<div class="empty">${X(UI.empty)}</div>`;
  const done=ITEMS.filter(i=>my[i[0]]&&my[i[0]].p).length,raters=new Set([...Object.keys(all).filter(id=>id!==meId&&Object.values(all[id]||{}).some(x=>x&&x.p)),...(done?[meId||'me']:[])]).size;
  document.getElementById('prog').innerHTML=LANG==='he'?`דירגת <b>${done}</b> מתוך <b>${ITEMS.length}</b> · <b>${raters}</b> ${raters===1?'אדם דירג':'אנשים דירגו'}`:`You rated <b>${done}</b> of <b>${ITEMS.length}</b> · <b>${raters}</b> ${raters===1?'person has':'people have'} rated`;
  document.getElementById('progbar').style.width=(done/ITEMS.length*100).toFixed(1)+'%';
  document.getElementById('f-mine').setAttribute('aria-pressed',String(onlyMine));document.getElementById('f-win').setAttribute('aria-pressed',String(onlyWin));
}
function setState(k){stKey=k;document.getElementById('state').textContent=k?X(UI[k]):'';
  if(k==='st_saved'){clearTimeout(stTimer);stTimer=setTimeout(()=>{if(stKey==='st_saved')setState('');},2200);}}
function full(){staticText();drawEpics();draw();setState(stKey);}

/* ---------- events ---------- */
document.getElementById('lang').addEventListener('click',()=>{LANG=LANG==='he'?'en':'he';try{localStorage.setItem('backlog-lang',LANG);}catch(e){}full();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;draw();});
document.getElementById('sort').addEventListener('change',e=>{sortBy=e.target.value;draw();});
document.getElementById('f-mine').addEventListener('click',()=>{onlyMine=!onlyMine;draw();});
document.getElementById('f-win').addEventListener('click',()=>{onlyWin=!onlyWin;draw();});
document.getElementById('epics').addEventListener('click',e=>{const b=e.target.closest('[data-ep]');if(!b)return;epic=b.dataset.ep;drawEpics();draw();});
document.getElementById('items').addEventListener('change',e=>{const s=e.target.closest('select[data-k]');if(!s)return;
  const k=s.dataset.k,f=s.dataset.f,v=+s.value;const cur={...(my[k]||{})};if(v)cur[f]=v;else delete cur[f];
  if(Object.keys(cur).length)my[k]=cur;else delete my[k];draw();persist();});
document.addEventListener('click',async e=>{
  const x=e.target.closest('[data-x]');if(x){const k=x.dataset.x;open.has(k)?open.delete(k):open.add(k);draw();if(open.has(k))resolveNames();return;}
  const c=e.target.closest('[data-cmt]');if(c){const t=document.getElementById(c.dataset.cmt);try{const cm=await window.claude?.use?.('comments');if(cm&&t){await cm.openComposer({element:t});return;}}catch(err){}setState('nocmt');}
});
/* one write at a time; the latest choice wins */
async function persist(){if(!db||!meId||ro)return;if(saving){pending=true;return;}
  saving=true;try{do{pending=false;await db.collection('ratings').doc(meId).set({r:JSON.parse(JSON.stringify(my))});}while(pending);setState('st_saved');}
  catch(err){if(err&&err.code==='not_granted'){ro=true;setState('st_ro');draw();}else setState('st_fail');}
  saving=false;}
async function resolveNames(){if(!user)return;const ids=Object.keys(all).filter(id=>id!==meId&&!names[id]);if(!ids.length)return;
  try{const ps=await user.profiles(ids);let ch=false;ids.forEach(id=>{const n=ps&&ps[id]&&ps[id].name;if(n){names[id]=n;ch=true;}});if(ch)draw();}catch(e){}}
full();
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function'){setState('st_local');return;}
  const timer=setTimeout(()=>{if(!live)setState('st_slow');},10000);
  try{
    db=await window.claude.use('db');user=await window.claude.use('user');
    if(!db||!user){clearTimeout(timer);db=null;setState('st_local');return;}
    meId=await user.id();if(!meId){clearTimeout(timer);db=null;setState('st_local');return;}
    db.collection('ratings').onSnapshot(snap=>{
      if(!snap.fromCache)clearTimeout(timer);
      const a={};snap.docs.forEach(d=>{const x=d.data()||{};if(x.r&&typeof x.r==='object')a[d.id]=x.r;});
      all=a;if(!live&&a[meId]&&!Object.keys(my).length)my=JSON.parse(JSON.stringify(a[meId]));
      live=true;if(stKey==='st_slow'||stKey==='st_local')setState('');draw();resolveNames();
    },()=>{clearTimeout(timer);setState('st_stop');});
  }catch(err){clearTimeout(timer);db=null;setState('st_local');}
})();
</script>
