/* ---------- invoice check, all trips ---------- */
function vGaps(){
  const ts=visibleTrips();if(!ts.length)return noTrip();
  const G=gapStats(ts);
  const kinds=['rooms','qty','rate','comp','extra','dup','under'];
  const stOf=x=>x.s.k==='credited'?'credited':x.s.st;
  const list=G.list.filter(x=>(S.gF==='all'||(stOf(x)===S.gF&&!(S.gF==='open'&&x.usd<0&&S.gK!=='under')))&&(S.gK==='All'||kindOf(x.l,x.s)===S.gK)).sort((a,b)=>Math.abs(b.usd)-Math.abs(a.usd));
  const kmx=Math.max(...Object.values(G.byKind).map(b=>b.amt),1);
  const byKind={};G.list.forEach(x=>{if(x.orig<=0)return;const k=kindOf(x.l,x.s),b=byKind[k]||(byKind[k]={n:0,amt:0});b.n++;b.amt=r2(b.amt+x.orig);});
  const kbars=kinds.filter(k=>byKind[k]).sort((a,b)=>byKind[b].amt-byKind[a].amt).map(k=>`<div class="hbar"><span>${kindL(k)}</span><div class="t"><div style="width:${byKind[k].amt/kmx*100}%;background:var(--red);opacity:.75"></div></div><span class="small hv">${usd(byKind[k].amt)} · ${byKind[k].n}</span></div>`).join('');
  const sup=Object.entries(G.bySup).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.trips.size}</td><td class="n">${v.n}</td><td class="n neg">${usd(v.amt)}</td><td class="n pos">${usd(v.rec)}</td></tr>`).join('');
  const rows=list.map(x=>{const st=stOf(x),k=kindOf(x.l,x.s);return `<tr><td><a href="#" data-act="open" data-v="${x.t.id}" data-pt="tfin" style="color:var(--blue)">${esc(x.t.name)}</a><div class="small muted">${stn(x.t.stage)}</div></td><td>${esc(x.l.sup)}<div class="small muted">${esc(x.l.inv.no)}</div></td><td>${kindPill(k)}</td><td class="n ${x.orig>0?'neg':'pos'}">${sgn(x.orig,v=>usd(v))}</td><td>${gstPill(st)}</td></tr>`;}).join('');
  const rate=G.received?G.matched/G.received:0;
  const sel=(k,arr,v)=>`<select data-ch="${k}">${arr.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  return head(L('בקרת חשבוניות','Invoice check'),pillF(L('חדש','New'),'green'))+`<p class="muted">${L('כל חשבונית ספק מותאמת למה שתומחר בהצעה. פערים נמצאים לבד ונשארים במעקב עד שמתקבל זיכוי או שהחיוב מאושר.','Every supplier invoice is matched to what you quoted. Gaps are found automatically and tracked until they are credited or accepted.')}</p>
  <div class="stats"><div class="stat"><div class="l">${L('חשבוניות שנקראו','Invoices read')}</div><div class="v">${G.received}</div><div class="s">${pct(rate)} ${L('תואמות בלי מגע יד','matched with no touch')}</div></div>
   <div class="stat"><div class="l">${L('פתוחים, טרם נשלחה דרישה','Open, no dispute yet')}</div><div class="v neg">${usd(G.open)}</div><div class="s">${G.openN} ${L('פערים','gaps')}</div></div>
   <div class="stat"><div class="l">${L('נשלחה דרישת זיכוי','Dispute sent')}</div><div class="v">${usd(G.disp)}</div><div class="s">${G.dispN} ${L('פערים','gaps')}</div></div>
   <div class="stat"><div class="l">${L('הוחזר העונה','Recovered this season')}</div><div class="v pos">${usd(G.rec)}</div><div class="s">${G.recN} ${L('זיכויים','credits')}</div></div>
   <div class="stat"><div class="l">${L('חשבוניות חסרות','Missing invoices')}</div><div class="v">${G.missing}</div><div class="s">${L('בטיולים שחזרו','on returned trips')}</div></div></div>
  <div class="two"><div class="card"><h3>${L('איפה הכסף בורח, לפי סוג פער','Where money leaks, by gap type')}</h3>${kbars||`<p class="muted">${L('אין פערים.','No gaps.')}</p>`}<p class="small muted" style="margin:6px 0 0">${L('סכום הפערים שנמצאו, כולל כאלה שכבר זוכו.','Total gaps found, including ones already credited.')}</p></div>
   <div class="card"><h3>${L('ספקים שמחייבים ביתר','Suppliers that overbill')}</h3><div class="scroll"><table class="tbl"><thead><tr><th>${L('ספק','Supplier')}</th><th class="n">${L('טיולים','Trips')}</th><th class="n">${L('פערים','Gaps')}</th><th class="n">${L('חיוב ביתר','Overbilled')}</th><th class="n">${L('הוחזר','Recovered')}</th></tr></thead><tbody>${sup}</tbody></table></div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${L('כל הפערים','All gaps')} <span class="cnt">${list.length}</span></h3><div class="row">
   <label class="row small muted">${L('סטטוס','Status')} ${sel('gF',[['open',L('פתוח','Open')],['disputed',L('נשלחה דרישה','Dispute sent')],['credited',L('זוכה','Credited')],['accepted',L('אושר','Accepted')],['all',L('הכל','All')]],S.gF)}</label>
   <label class="row small muted">${L('סוג','Type')} ${sel('gK',[['All',L('הכל','All')],...kinds.map(k=>[k,kindL(k)])],S.gK)}</label></div></div>
   <div class="scroll tall" style="max-height:520px"><table class="tbl"><thead><tr><th>${L('טיול','Trip')}</th><th>${L('ספק וחשבונית','Supplier and invoice')}</th><th>${L('סוג','Type')}</th><th class="n">${L('פער','Gap')}</th><th>${L('סטטוס','Status')}</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="muted">${L('אין פערים בסינון הזה.','No gaps in this filter.')}</td></tr>`}</tbody></table></div></div>`;
}

  const SH={HolyLand:['ארץ הקודש','Holy Land'],Washington:['וושינגטון','DC'],NewEngland:['ניו אינגלנד','New England'],Canyon:['גרנד קניון','Canyon'],Rome:['רומא','Rome'],Greece:['יוון','Greece'],Niagara:['ניאגרה','Niagara'],London:['לונדון','London'],Ireland:['אירלנד','Ireland'],Branson:['ברנסון','Branson'],Nashville:['נאשוויל','Nashville']};

  const cm=Math.max(...MONTHS.map(k=>Math.max(P.cash[k].in,P.cash[k].out)),1);

const MESSY=[['Evening show, group rate','$48.00 pp','min 20 pax, 1 comp per 20'],['Showboat dinner cruise','64','2026 rate?'],['Motorcoach 56 pax / day','1,180','+ driver room'],['Step-on guide (4h)','USD 240',''],['Hotel dbl / night','112.00 USD','tax 12.6% not incl.'],['Theme park ticket','72/pp','senior rate 68'],['Lunch buffet','18,5','currency?'],['Fuel surcharge','—','ask Jim']];
const CATS=[[/hotel|lodge|room|dbl/i,'Lodging'],[/coach|bus|transfer|shuttle|fuel/i,'Transport'],[/guide/i,'Guide'],[/dinner|lunch|meal|buffet/i,'Meals'],[/insur|protection/i,'Insurance'],[/./,'Activities']];
function parseRow(r){
  const raw=String(r[1]).trim(),note=String(r[2]||''),cat=CATS.find(c=>c[0].test(r[0]))[1];
  if(!raw||/^[—–-]+$/.test(raw))return {item:r[0],cat,ok:false,flag:L('אין מחיר בקובץ. יש לשאול את הספק.','No price in the file. Ask the supplier.')};
  let s=raw.match(/\d[\d.,]*/)[0];s=/^\d{1,3},\d{3}/.test(s)?s.replace(/,/g,''):s.replace(',','.');const num=parseFloat(s);
  const cur=/€|eur/i.test(raw)?'EUR':/\$|usd/i.test(raw)?'USD':null,per=/pp|per person/i.test(raw);
  let v=num,flag='';
  if(cur==='EUR'){v=r2(num*BASE_RATE.EUR);flag=L('מחיר ביורו, הומר לדולר בשער 1.08. לאשר מול הספק.','Price in EUR, converted to USD at 1.08. Confirm with the supplier.');}
  else if(!cur)flag=L('מטבע לא צוין. הונח דולר, צריך בדיקה.','Currency not stated. Assumed USD, needs a check.');
  if(/tax/i.test(note))flag=(flag?flag+' ':'')+L('מס לא כלול, להוסיף 12.6%.','Tax not included; add 12.6%.');
  if(/senior rate/i.test(note))flag=(flag?flag+' ':'')+L('שני תעריפים בקובץ. נלקח התעריף הרגיל, לבדוק תעריף גמלאים.','Two rates in the file. The standard rate was used; check the senior rate.');
  const basis=per?'person':/day/i.test(r[0])?'day':/night/i.test(r[0])?'room':'person';
  return {item:r[0],cat,ok:true,usd:v,basis,flag,warn:!!flag,comp:/comp/i.test(note)};
}
function vImport(){
  const raw=MESSY.map(r=>`<tr><td dir="ltr" style="text-align:left">${esc(r[0])}</td><td dir="ltr" style="text-align:left">${esc(r[1])}</td><td dir="ltr" style="text-align:left">${esc(r[2])}</td></tr>`).join('');
  let out='';
  if(S.ran){const p=MESSY.map(parseRow);

  t.groups=genGroups(t.seg,t.pax,R);t.groups.forEach(g=>{g.depPaid=false;g.balPaid=false;});

/* ---------- profit-leak model and snapshot (v7, Phase A) ----------
   The bridge runs from planned profit to expected profit. Its steps are the supplier-invoice
   differences by kind plus FX, so per trip: planProfit - amtDiff - fx = fcProfit (check6.js).
   Items that are not yet in the books (room-block release, late client payments, missing
   invoices) sit beside the bridge as "at risk", never inside it. */

  if(t.stage!=='Operations'||!t.room)return null;

  if(!(n>0)||!(D(rd)<TODAY))return null;
  const lod=t.lines.find(l=>l.type==='Lodging'&&l.cost>0);if(!lod)return null;
  return {t,n,rd,amt:r2(n*t.nights*lod.cost*lrate(t,lod))};
}

function brandSwap(t,i){
  if(!HAS_CAT()||t.id==='nen')return t;
  if(t.lines.some(l=>l.inv&&(l.inv.kind||invStatus(l).k==='gap')))return t;
  const hs=catHotels(t.dest).filter(h=>h.stars>=4);if(!hs.length)return t;
  const h=hs.at(i%hs.length),old=t.lines.find(l=>l.type==='Lodging');if(!old)return t;
  const was=old.sup;t.lines.forEach(l=>{if(l.sup===was)l.sup=h.name;});
  if(t.room&&t.room.hotel===was)t.room.hotel=h.name;
  if(t.sups)t.sups.forEach(s=>{if(s.n===was)s.n=h.name;});
  return t;
}
