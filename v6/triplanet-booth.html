@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111c; --panel:#121c2c; --recess:#0e1726; --ink:#e8edf5; --ink2:#c5cedb; --muted:#97a3b5; --line:#24324a;
    --side:#070d16; --side2:#111d2e;
    --orange:#fb9a5c; --yellow:#f5c542; --amber:#f6b94a; --blue:#7aa7ff; --purple:#b69cff; --green:#4ade80; --red:#ff8585; --teal:#4fd1c5;
    --tile:#17454b; --btn:#e8edf5; --btn-ink:#0a111c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111c; --panel:#121c2c; --recess:#0e1726; --ink:#e8edf5; --ink2:#c5cedb; --muted:#97a3b5; --line:#24324a;
  --side:#070d16; --side2:#111d2e;
  --orange:#fb9a5c; --yellow:#f5c542; --amber:#f6b94a; --blue:#7aa7ff; --purple:#b69cff; --green:#4ade80; --red:#ff8585; --teal:#4fd1c5;
  --tile:#17454b; --btn:#e8edf5; --btn-ink:#0a111c; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-ui);direction:rtl;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px;margin-bottom:10px}
p{margin:0 0 10px;max-width:72ch}
.muted{color:var(--muted)} .small{font-size:12.5px}
.app{display:flex;gap:16px;align-items:flex-start;max-width:1320px;margin:0 auto}
.side{min-width:0;flex:0 0 218px;background:var(--side);border-radius:18px;padding:16px 12px;position:sticky;top:16px;color:var(--side-ink)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff;font-weight:700;font-size:18px;letter-spacing:.01em}
.brand i{width:34px;height:34px;border-radius:50%;background:#2c3e57;display:inline-block}
.nv{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:10px;font:500 14px var(--f-ui);cursor:pointer;text-align:start}
.nv .ic{width:22px;text-align:center;opacity:.9}
.nv:hover{background:var(--side2)}
.nv.on{background:rgba(34,197,94,.14);color:#4ade80}
.nvh{font-size:11px;letter-spacing:.06em;color:#7d8da3;padding:14px 12px 4px}
.content{flex:1;min-width:0;background:var(--panel);border-radius:18px;padding:18px 22px 28px;border:1px solid var(--line)}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;background:#dbe4f3;color:#17304f;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.bell{position:relative;background:none;border:0;cursor:pointer;font-size:17px;color:var(--ink2);padding:2px 4px}
.bell b{position:absolute;top:-4px;inset-inline-start:-4px;background:#e5482d;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
select,input[type=number],input[type=text],input[type=date]{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
input[type=number]{width:84px;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{width:min(320px,100%);accent-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{font:500 13px var(--f-ui);cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 14px}
.btn:hover{background:var(--recess)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.grn{background:#15803d;border-color:#15803d;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(15,27,42,.04)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:18px}
.sec{margin-bottom:22px}
.scroll{overflow-x:auto}
.tall{max-height:400px;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;font-weight:500;font-size:12px;color:var(--muted);padding:10px 12px;background:var(--recess);white-space:nowrap}
.tbl th:first-child{border-radius:0 10px 10px 0} .tbl th:last-child{border-radius:10px 0 0 10px}
.tbl td{padding:11px 12px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.pill{--c:var(--muted);display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel))}
.pill.orange{--c:var(--orange)} .pill.yellow{--c:var(--yellow)} .pill.amber{--c:var(--amber)} .pill.blue,.pill.info{--c:var(--blue)}
.pill.purple,.pill.pur{--c:var(--purple)} .pill.green,.pill.ok{--c:var(--green)} .pill.red,.pill.bad{--c:var(--red)} .pill.warn{--c:var(--amber)} .pill.teal,.pill.ai{--c:var(--teal)}
.stq{display:inline-flex;align-items:center;gap:6px}
.stq b{background:var(--recess);border:1px solid var(--line);border-radius:7px;font-size:11px;padding:1px 7px;font-weight:600}
.pos{color:var(--green)} .neg{color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.tile{display:flex;align-items:center;gap:12px;padding:14px 16px;border-inline-start:1px dashed var(--line);min-width:0}
.tile:first-child{border-inline-start:0}
.tile .ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));border:3px solid color-mix(in srgb,var(--c) 40%,transparent)}
.tile .l{font-weight:600;font-size:14px} .tile .s{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--recess);border-radius:14px;padding:12px 14px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.dk{background:var(--tile);color:var(--tile-ink);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dk .big{font-size:42px;font-weight:700;line-height:1.1}
.dk .t{font-size:13px;opacity:.9}
.chart{display:flex;align-items:flex-end;gap:12px;height:210px;padding:22px 4px 0;min-width:520px;direction:ltr;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center}
.chart .b{width:36%;max-width:30px;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart .b i{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:500 10px var(--f-ui);font-style:normal;color:var(--ink2);white-space:nowrap}
.b.plan{background:var(--muted);opacity:.55} .b.fc{background:var(--teal)} .b.in{background:#22a06b} .b.out{background:#e07a5f} .b.won{background:#4aa66f} .b.lost{background:#f2a98a}
.xl{display:flex;gap:12px;min-width:520px;padding:6px 4px 0;direction:ltr}
.xl span{flex:1;text-align:center;font-size:11.5px;color:var(--ink2);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.hbar{display:grid;grid-template-columns:104px 1fr 120px;gap:10px;align-items:center;font-size:13px;margin-bottom:9px}
.hbar .t{height:9px;border-radius:5px;background:var(--recess);overflow:hidden;margin-bottom:3px}
.hbar .t div{height:100%;border-radius:5px}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:11px 16px;font:500 14px var(--f-ui);cursor:pointer;white-space:nowrap;flex:1;text-align:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs em{font-style:normal;font-size:10px;background:#dcfce7;color:#166534;border-radius:99px;padding:1px 6px;margin-inline-start:5px}
.cnt{display:inline-block;background:var(--recess);border-radius:8px;padding:0 8px;font-size:12px;margin-inline-start:6px}
.tabs button.on .cnt{background:var(--btn);color:var(--btn-ink)}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.th .no{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle;font-weight:500}
.th .sub{color:var(--muted);font-size:14px}
.stbox{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--orange) 12%,var(--panel));border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;color:var(--orange)}
.stbox b{background:var(--panel);color:var(--ink);border-radius:8px;padding:1px 8px;font-size:11px}
.master{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--recess);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.master strong{font-size:18px}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc.over{outline:2px dashed var(--blue)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:14px 16px;font:700 16px var(--f-ui);color:var(--ink);cursor:pointer}
.acc .bd{padding:4px 16px 16px}
.welcome{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--recess)}
.site{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:grab;flex-wrap:wrap}
.site:last-child{border-bottom:0}
.flag{color:#2563eb;font-size:20px;width:26px;text-align:center}
.site .nm{flex:1;font-weight:600;min-width:150px}
.cbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12px;color:var(--muted)}
.cbox input{border:0;padding:0;width:58px;background:none}
.warnbox{margin-top:8px;font-size:12.5px;color:var(--red);font-weight:600}
.tpl{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.tpl .im{height:96px;border-radius:10px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:flex-start;padding:8px}
.tpl ul{margin:6px 0 10px;padding-inline-start:18px;font-size:13px;color:var(--ink2)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.sw input{accent-color:#15803d;width:18px;height:18px}
.type{display:inline-flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.type i{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px;flex:none}
.inl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.inl select{border:0;border-radius:0;padding:7px 4px;background:var(--recess)}
.inl input{border:0;border-radius:0;width:64px}
.doc{background:#fff;color:#1a1a1a;border-radius:10px;overflow:hidden;direction:ltr;text-align:left;border:1px solid var(--line)}
.doc .hero{background:linear-gradient(135deg,#0d3b44,#1e6f7c 60%,#b87a3a);color:#fff;padding:26px 22px}
.doc .hero h2{font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.doc .hero .meta{font-size:13px;opacity:.95}
.doc .intro{background:#217787;color:#fff;padding:16px 22px;font-size:13.5px}
.doc .body{padding:18px 22px}
.doc h3{color:#217787}
.doc .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.doc .dc{border:1px solid #e3e7ee;border-radius:10px;padding:12px;font-size:13px}
.doc .dc b{display:block;color:#217787;font-size:20px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc td{padding:6px 0;border-bottom:1px solid #e3e7ee;font-size:13.5px}
.doc td:last-child{text-align:right}
.prog{height:8px;border-radius:5px;background:var(--recess);overflow:hidden;min-width:60px}
.prog div{height:100%;background:var(--blue)}
.pr{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--recess) 0)}
.pr span{background:var(--panel);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:76ch;font-size:14px;white-space:pre-wrap}
.msg.u{align-self:flex-start;background:var(--btn);color:var(--btn-ink)}
[dir=ltr] .msg.u{align-self:flex-end}
[dir=ltr] .msg.a{align-self:flex-start}
.msg.a{align-self:flex-end;background:var(--recess);border:1px solid var(--line)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.alert:last-child{border-bottom:0}
.alert>div{flex:1;min-width:0}
.ev{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13.5px}
.ev .dot{width:9px;height:9px;border-radius:50%;flex:none}
.evh{background:var(--recess);font-weight:700;padding:7px 12px;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:860px){
  .app{flex-direction:column;gap:12px;align-items:stretch}
  .side{flex:none;width:100%;position:static;display:flex;overflow-x:auto;gap:2px;padding:8px;align-items:center}
  .brand{padding:0 10px 0 6px;flex:none} .nv{width:auto;white-space:nowrap;flex:none} .nvh{display:none}
  .content{padding:14px 14px 22px}
  .pg,.pg.rev{grid-template-columns:1fr}
}


:root{--f-ui:'Plex','IBM Plex Sans Hebrew','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
body{direction:ltr}
#app[dir=rtl]{direction:rtl} #app[dir=ltr]{direction:ltr}
[dir=ltr] .tbl th:first-child{border-radius:10px 0 0 10px} [dir=ltr] .tbl th:last-child{border-radius:0 10px 10px 0}
.brand i{display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#fca5a5;background:#3b1d2a}
.brand small{display:block;font-size:11px;font-weight:500;color:#8fa1b8;letter-spacing:0}
.nv .star{color:#facc15;font-size:11px;margin-inline-start:auto}
.topbar{justify-content:flex-start}
.grow{flex:1}
.iconb{background:none;border:1px solid transparent;border-radius:8px;cursor:pointer;padding:3px 5px;font-size:18px;color:var(--ink2);display:inline-flex;align-items:center}
.iconb:hover{border-color:var(--line);background:var(--recess)}
.iconb svg{border-radius:3px;display:block}
.tourbtn{border-color:color-mix(in srgb,var(--teal) 40%,var(--line));color:var(--teal);font-weight:600}
.mwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,27,42,.18);padding:6px;width:250px}
.menu>button{display:block;width:100%;text-align:start;background:none;border:0;padding:9px 10px;border-radius:8px;font:500 13.5px var(--f-ui);color:var(--ink);cursor:pointer}
.menu>button:hover{background:var(--recess)}
.menu .mz{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.menu .mz span{flex-basis:100%}
.no{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:12px;flex-wrap:wrap}
.pager select{padding:4px 8px}
.bdg{display:inline-block;background:#e5482d;color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;padding:0 5px;margin-inline-start:6px;font-weight:600}
.okc{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:color-mix(in srgb,var(--green) 18%,var(--panel));color:var(--green);font-weight:700}
.hbar{grid-template-columns:150px 1fr 150px}
.hbar .hv{text-align:end;direction:ltr}
[dir=rtl] .hbar .hv{text-align:left}
.welcome{display:flex;gap:14px;align-items:flex-start}
.welcome .wim{flex:none;width:96px;height:96px;border-radius:12px;background:linear-gradient(160deg,#9cc3d9,#3b6fa5 55%,#2a3f5c)}
.doc .logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;margin-bottom:14px}
.doc .logo span{width:26px;height:26px;border-radius:50%;background:#fff;color:#b5403a;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.doc .dimg{height:70px;border-radius:8px;margin-bottom:8px}
.doc .hero{background:linear-gradient(135deg,#0d3b44,#1e6f7c 55%,#b87a3a)}
pre.mail{white-space:pre-wrap;direction:ltr;text-align:left;font:13px/1.55 var(--f-ui);background:var(--recess);padding:12px;border-radius:10px;margin:10px 0;max-height:360px;overflow:auto}
/* invoice check */
.inbox{border-color:color-mix(in srgb,var(--teal) 45%,var(--line));background:color-mix(in srgb,var(--teal) 5%,var(--panel))}
.files{display:grid;gap:6px;margin-top:12px}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.file .fi{font-size:10px;font-weight:700;color:#fff;background:#c2410c;border-radius:5px;text-align:center;padding:4px 0}
.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.file.cur{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}
.file.cur .small{color:var(--teal);font-weight:600}
.file.ok{opacity:.95}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:15px;border:1px solid}
.banner.bad{background:color-mix(in srgb,var(--red) 8%,var(--panel));border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.banner.good{background:color-mix(in srgb,var(--green) 8%,var(--panel));border-color:color-mix(in srgb,var(--green) 30%,var(--line))}
.gapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.gapc{border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:12px;padding:12px 14px;background:var(--panel);min-width:0}
.gapc.st-disputed{border-inline-start-color:var(--amber)} .gapc.st-credited{border-inline-start-color:var(--green);opacity:.85} .gapc.st-accepted{border-inline-start-color:var(--blue);opacity:.8}

  const isPre=l=>/^Group air/.test(l.name)||l.type==='Insurance';

      else if(l.type==='Meals'){if(r<.18)o={...o,qty:l.qty+2+Math.floor(R()*5),kind:'qty'};}
    }
    if(o.kind){o.st=o.kind==='under'?(st==='Closed'?'accepted':'open'):gs();if(o.st!=='credited'&&o.st!=='accepted')o.paid=false;}
    l.inv=mkInv(t,l,R,o);settle(l);

    if(late&&l.type==='Guide'&&R()<.12)addExtra(t,l,'Duplicate of '+l.inv.no,l.inv.amt,'dup',gs(),R,l.inv.no);
  });
}

/* ---------- pricing and finance logic ---------- */
const mkOf=(t,l)=>(l.ov!==''&&l.ov!=null&&!isNaN(+l.ov))?+l.ov:t.markups[l.type];
const priceC=(t,l)=>t.basis==='cost'?planC(l)*(1+mkOf(t,l)/100):planC(l)/(1-mkOf(t,l)/100);
const effAmt=i=>r2(i.amt-(i.credit||0));
function invStatus(l){
  if(!l.inv)return {k:'none',diff:0,kind:'missing'};
  const i=l.inv,diff=r2(effAmt(i)-planC(l));
  if(Math.abs(diff)<.005)return {k:i.credit?'credited':'match',diff:0,kind:i.kind,st:i.st,credit:i.credit||0};
  return {k:'gap',diff,kind:i.kind||(diff<0?'under':'rate'),st:i.st||'open',credit:i.credit||0};
}
const isOpenGap=s=>s.k==='gap'&&(s.st==='open'||s.st==='disputed');
function discOf(t,o){const out={};if(!t.disc)return out;
  Object.keys(t.disc).forEach(k=>{const d=t.disc[k];if(!d||!(+d.v>0))return;const p=k.split('|'),sh=p[0]==='s';
    const base=o.lines.filter(x=>!x.l.extra&&x.l.type===p[1]&&(x.l.scope==='shared')===sh).reduce((a,x)=>a+x.price,0);
    out[k]=d.m==='%'?r2(base*Math.min(100,+d.v)/100):r2(Math.min(base,sh?+d.v:+d.v*t.pax));});
  return out;}
function calc(t){
  const o={rev:0,plan:0,fc:0,amtDiff:0,fx:0,comm:0,byType:{},lines:[]};
  t.lines.forEach(l=>{
    const lr=lrate(t,l),pc=planC(l),price=r2(priceC(t,l)*lr),planUSD=r2(pc*lr);
    let amtDiff=0,fx=0;
    if(l.inv){const e=effAmt(l.inv);amtDiff=r2((e-pc)*lr);fx=(l.inv.paid&&l.cur!=='USD')?r2(e*(l.inv.rate-t.rate)):0;}
    const fc=r2(planUSD+amtDiff+fx),comm=r2(l.comm/100*pc*lr);
    o.rev=r2(o.rev+price);o.plan=r2(o.plan+planUSD);o.fc=r2(o.fc+fc);
    o.amtDiff=r2(o.amtDiff+amtDiff);o.fx=r2(o.fx+fx);o.comm=r2(o.comm+comm);
    const b=o.byType[l.type]||(o.byType[l.type]={plan:0,fc:0,rev:0});
    b.plan=r2(b.plan+planUSD);b.fc=r2(b.fc+fc);b.rev=r2(b.rev+price);
    o.lines.push({l,price,planUSD,fc,comm,amtDiff,fx});
  });
  o.disc=0;o.discBy=discOf(t,o);
  Object.keys(o.discBy).forEach(k=>{const a=o.discBy[k],ty=k.split('|')[1];o.rev=r2(o.rev-a);o.byType[ty].rev=r2(o.byType[ty].rev-a);o.disc=r2(o.disc+a);});
  o.planProfit=r2(o.rev-o.plan+o.comm);o.fcProfit=r2(o.rev-o.fc+o.comm);
  return o;
}
/* gaps of one trip, in USD */
function tripGaps(t){
  const out=[];
  t.lines.forEach(l=>{const s=invStatus(l),lr=lrate(t,l);
    if(s.k==='gap'||s.k==='credited')out.push({t,l,s,usd:r2((s.k==='credited'?s.credit:s.diff)*lr),orig:r2((effAmt(l.inv)+(l.inv.credit||0)-planC(l))*lr)});});
  return out;
}
const inboxIds=t=>{const s=new Set();(t.inbox||[]).forEach(f=>(f.inv||[]).forEach(x=>s.add(x[0])));return s;};
function gapStats(ts){
  const G={open:0,openN:0,disp:0,dispN:0,acc:0,accN:0,rec:0,recN:0,under:0,underN:0,missing:0,matched:0,received:0,expected:0,byKind:{},bySup:{},list:[]};
  ts.filter(t=>t.stage!=='Quote').forEach(t=>{const ib=inboxIds(t);
    t.lines.forEach(l=>{if(!l.extra)G.expected++;if(l.inv){G.received++;const s=invStatus(l);if(s.k==='match')G.matched++;}
      else if(!l.extra&&!ib.has(l.id)&&(t.stage==='Finance'||t.stage==='Closed'))G.missing++;});
    tripGaps(t).forEach(g=>{
      G.list.push(g);const k=g.s.kind||'rate',st=g.s.k==='credited'?'credited':g.s.st;
      if(g.s.k==='credited'){G.rec=r2(G.rec+g.usd);G.recN++;}
      else if(g.usd<0){G.under=r2(G.under+g.usd);G.underN++;}
      else if(st==='open'){G.open=r2(G.open+g.usd);G.openN++;}
      else if(st==='disputed'){G.disp=r2(G.disp+g.usd);G.dispN++;}
      else{G.acc=r2(G.acc+g.usd);G.accN++;}
      if(g.orig>0){const b=G.byKind[k]||(G.byKind[k]={n:0,amt:0});b.n++;b.amt=r2(b.amt+g.orig);
        const sp=G.bySup[g.l.sup]||(G.bySup[g.l.sup]={n:0,amt:0,rec:0,trips:new Set()});sp.n++;sp.amt=r2(sp.amt+g.orig);sp.trips.add(t.id);if(g.s.k==='credited')sp.rec=r2(sp.rec+g.usd);}
    });
  });
  return G;
}
function lateInfo(t,g){
  const dd=D(t.depDue),bd=D(t.balDue);let amt=0,days=0;
  if(!g.depPaid&&dd<TODAY){amt+=g.dep;days=Math.max(days,Math.floor((TODAY-dd)/DAY));}
  if(!g.balPaid&&bd<TODAY){amt+=g.bal;days=Math.max(days,Math.floor((TODAY-bd)/DAY));}
  return {amt:r2(amt),days};
}
function groupsCalc(t){
  const c=calc(t),rows=t.groups.map(g=>({...g,amt:r2(c.rev*g.size/t.pax)}));
  if(rows.length){const diff=r2(c.rev-rows.reduce((a,g)=>a+g.amt,0));rows[rows.length-1].amt=r2(rows[rows.length-1].amt+diff);}
  rows.forEach(g=>{g.dep=r2(g.amt*t.pct/100);g.bal=r2(g.amt-g.dep);g.paid=r2((g.depPaid?g.dep:0)+(g.balPaid?g.bal:0));g.open=r2(g.amt-g.paid);const li=lateInfo(t,g);g.late=li.amt;g.days=li.days;});
  const collected=r2(rows.reduce((a,g)=>a+g.paid,0));
  return {rows,collected,outstanding:r2(c.rev-collected),perHead:r2(c.rev/t.pax),late:r2(rows.reduce((a,g)=>a+g.late,0))};
}
const monthKey=dt=>{if(dt<TODAY)dt=TODAY;return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');};
const MONTHS=(()=>{const a=[];for(let i=0;i<12;i++){const d=new Date(2026,9+i,1);a.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}return a;})();
const monthLabel=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString(LOC(),{month:'short'});
function portfolio(ts){
  const P={rev:0,plan:0,fc:0,amtDiff:0,fx:0,comm:0,pax:0,col:0,late:0,lateN:0,pipeline:0,pipelineN:0,rows:[],bySeg:{},byDest:{},sup:{},cash:{},aging:[0,0,0],agingN:[0,0,0],fxExp:{},gapN:0,noneN:0,lateGroups:[]};
  MONTHS.forEach(m=>P.cash[m]={in:0,out:0});
  ts.forEach(t=>{
    const c=calc(t);
    if(t.stage==='Quote'){P.pipeline=r2(P.pipeline+c.rev);P.pipelineN++;return;}
    const g=groupsCalc(t);
    P.rev=r2(P.rev+c.rev);P.plan=r2(P.plan+c.plan);P.fc=r2(P.fc+c.fc);P.amtDiff=r2(P.amtDiff+c.amtDiff);P.fx=r2(P.fx+c.fx);P.comm=r2(P.comm+c.comm);
    P.pax+=t.pax;P.col=r2(P.col+g.collected);P.late=r2(P.late+g.late);
    const fp=c.fcProfit,pp=c.planProfit;
    P.rows.push({t,c,g,pp,fp});
    [['bySeg',t.seg],['byDest',t.dest]].forEach(([k,key])=>{const b=P[k][key]||(P[k][key]={rev:0,fp:0,pax:0,n:0});b.rev=r2(b.rev+c.rev);b.fp=r2(b.fp+fp);b.pax+=t.pax;b.n++;});
    g.rows.forEach(r=>{
      if(!r.depPaid){const k=monthKey(D(t.depDue));if(P.cash[k])P.cash[k].in=r2(P.cash[k].in+r.dep);}
      if(!r.balPaid){const k=monthKey(D(t.balDue));if(P.cash[k])P.cash[k].in=r2(P.cash[k].in+r.bal);}
      if(r.late>0){P.lateN++;const bi=r.days<=30?0:r.days<=60?1:2;P.aging[bi]=r2(P.aging[bi]+r.late);P.agingN[bi]++;P.lateGroups.push({t,g:r});}
    });
    c.lines.forEach(x=>{
      const l=x.l,st=invStatus(l);
      if(st.k==='gap')P.gapN++;
      if(st.k==='none'&&!l.extra)P.noneN++;
      const s=P.sup[l.sup]||(P.sup[l.sup]={spend:0,open:0,issues:0,comm:0,trips:new Set()});
      s.spend=r2(s.spend+x.fc);s.comm=r2(s.comm+x.comm);s.trips.add(t.id);
      if(st.k==='gap')s.issues++;
      const unpaid=!(l.inv&&l.inv.paid);
      if(unpaid){
        s.open=r2(s.open+x.fc);
        const amtC=l.inv?effAmt(l.inv):planC(l);
        if(l.cur!=='USD'){const fe=P.fxExp[l.cur]||(P.fxExp[l.cur]={amt:0,usd:0});fe.amt+=amtC;fe.usd=r2(fe.usd+amtC*t.rate);}
        const dt=t.stage==='Finance'||t.stage==='Closed'?new Date(TODAY.getTime()+20*DAY):new Date(D(t.dep).getTime()-14*DAY);
        const k=monthKey(dt);if(P.cash[k])P.cash[k].out=r2(P.cash[k].out+amtC*lrate(t,l));
      }
    });
  });
  P.pp=r2(P.rev-P.plan+P.comm);P.fp=r2(P.rev-P.fc+P.comm);
  P.outstanding=r2(P.rev-P.col);
  return P;
}

const KIND={qty:['כמות מעל המוסכם','Over agreed quantity','red'],rooms:['חדרים מעל רשימת החדרים','Rooms over rooming list','red'],rate:['מחיר מעל החוזה','Above contracted rate','red'],comp:['הטבת חינם לא יושמה','Comp not applied','red'],

const kindOf=(l,s)=>s.kind==='qty'&&l.type==='Lodging'?'rooms':(s.kind||'rate');
const kindL=k=>L(KIND[k][0],KIND[k][1]);
const kindPill=k=>pillF(kindL(k),KIND[k][2]);
const GST={open:['פתוח','Open','red'],disputed:['נשלחה דרישת זיכוי','Dispute sent','amber'],accepted:['אושר','Accepted','blue'],credited:['זוכה','Credited','green']};
const gstPill=st=>pillF(L(GST[st][0],GST[st][1]),GST[st][2]);
function gapExplain(t,l){
  const i=l.inv,s=invStatus(l),k=kindOf(l,s),cur=l.cur,mm=v=>money(v,cur,0);
  if(!i)return L('לא התקבלה חשבונית. לפני סגירת התיק כדאי לבקש אותה, כדי שלא תגיע הפתעה אחרי שהרווח דווח.','No invoice yet. Ask for it before you close the file, so a surprise does not land after profit is reported.');
  if(k==='rooms'){const pr=Math.round(l.qty/t.nights),br=Math.round(i.qty/t.nights);
    return L(`חויבו ${br} חדרים ל-${t.nights} לילות. רשימת החדרים הסופית כללה ${pr} חדרים, והיא נשלחה לפני מועד השחרור בחוזה.`,`Billed ${br} rooms for ${t.nights} nights. The final rooming list had ${pr} rooms and was sent before the contract's release date.`);}
  if(k==='qty')return L(`חויבו ${i.qty} מנות. הספירה הסופית שנשלחה הייתה ${l.qty}.`,`Billed ${i.qty} covers. The final count sent was ${l.qty}.`);
  if(k==='rate')return L(`חויב ${mm(i.unit)} ל${l.unit==='person'?'אדם':'יחידה'} במקום תעריף הקבוצה בחוזה, ${mm(l.cost)}.`,`Billed ${mm(i.unit)} per ${l.unit} instead of the contracted group rate of ${mm(l.cost)}.`);
  if(k==='comp'){if(l.cost===0)return L(`חדר הנהג ניתן בחינם לפי החוזה, אבל חויב ${mm(i.amt)}.`,`The driver room is complimentary under the contract, but was billed at ${mm(i.amt)}.`);
    const c=Math.floor(t.pax/20);return L(`תעריף הקבוצה כולל כרטיס חינם על כל 20 משלמים (${c} כאן). חויבו ${i.qty} כרטיסים במקום ${l.qty}.`,`The group rate includes 1 free per 20 paying (${c} here). Billed ${i.qty} tickets instead of ${l.qty}.`);}
  if(k==='extra')return L(`"${esc(l.name)}" לא מופיע בהצעה ולא בחוזה עם הספק.`,`"${esc(l.name)}" is not in the quote or in the supplier contract.`);
  if(k==='dup')return L(`אותו מספר חשבונית ואותו סכום כמו ${esc(i.ref)}, התקבלה פעמיים.`,`Same invoice number and amount as ${esc(i.ref)}, received twice.`);
  if(k==='under')return L(`חויב ${mm(-s.diff)} פחות מההצעה. כדאי לוודא ששום שירות לא נשמט לפני התשלום.`,`Billed ${mm(-s.diff)} less than quoted. Check that no service was left out before you pay.`);
  return '';
}

/* ---------- alerts ---------- */
function alertsFor(ts,thresh){
  const A=[],P=portfolio(ts);
  ts.filter(t=>t.inbox&&t.inbox.length).forEach(t=>A.push({sev:'warn',txt:L(`${t.name}: ${t.inbox.length} חשבוניות ספקים חדשות ממתינות להתאמה.`,`${t.name}: ${t.inbox.length} new supplier invoices are waiting to be matched.`),trip:t.id,pt:'tfin'}));
  ts.filter(t=>t.stage==='Finance'||t.stage==='Operations').map(t=>{const g=tripGaps(t).filter(x=>isOpenGap(x.s)&&x.usd>0);return {t,n:g.length,amt:r2(g.reduce((a,x)=>a+x.usd,0))};}).filter(x=>x.n).sort((a,b)=>b.amt-a.amt).slice(0,3)
    .forEach(x=>A.push({sev:'bad',txt:L(`${x.t.name}: ${x.n} פערי חשבוניות פתוחים בסך ${usd(x.amt)}.`,`${x.t.name}: ${x.n} open invoice gaps worth ${usd(x.amt)}.`),trip:x.t.id,pt:'tfin'}));
  if(P.lateN)A.push({sev:'bad',txt:L(`${P.lateN} קבוצות חיוב באיחור בתשלום, בסך ${usd(P.late)}.`,`${P.lateN} billing groups are late on payment, totaling ${usd(P.late)}.`),go:'finance'});
  P.rows.filter(r=>r.c.rev>0&&r.fp/r.c.rev*100<thresh).forEach(r=>A.push({sev:'warn',txt:L(`${r.t.name}: שולי רווח צפויים ${pct(r.fp/r.c.rev)}, מתחת לקו ${thresh}%.`,`${r.t.name}: expected margin ${pct(r.fp/r.c.rev)}, below the ${thresh}% line.`),trip:r.t.id,pt:'tfin'}));
  ts.filter(t=>t.stage==='Operations'&&(D(t.dep)-TODAY)/DAY<=60&&(D(t.dep)-TODAY)>=0).forEach(t=>{const od=t.tasks.filter(x=>!x.done&&D(x.due)<TODAY).length,dd=Math.round((D(t.dep)-TODAY)/DAY);if(od)A.push({sev:'bad',txt:L(`${t.name} יוצא בעוד ${dd} ימים ויש ${od} משימות באיחור.`,`${t.name} departs in ${dd} days with ${od} overdue tasks.`),trip:t.id,pt:'ops'});});
  ts.filter(t=>t.stage==='Quote'&&t.qst==='Approval').forEach(t=>A.push({sev:'info',txt:L(`${t.name} ממתינה לאישור מנהל.`,`${t.name} is waiting for manager approval.`),trip:t.id,pt:'approve'}));
  ts.filter(t=>t.stage==='Quote'&&t.qst==='Sent'&&t.qdays>14).forEach(t=>A.push({sev:'info',txt:L(`ההצעה ל-${t.name} ממתינה ${t.qdays} ימים לתשובת הלקוח.`,`The quote for ${t.name} has waited ${t.qdays} days for the client.`),trip:t.id,pt:'approve'}));
  return A;
}

function trWord(w){
  if(DICT[w]!==undefined)return DICT[w];
  if(w.length>2&&HP[w[0]]&&DICT[w.slice(1)]!==undefined)return HP[w[0]]+DICT[w.slice(1)];
  return null;
}
function trChunk(m){
  if(DICT[m]!==undefined)return DICT[m];
  const sp=m.split(/([.!?:;]\s+)/);
  if(sp.length>1){let o='';for(let i=0;i<sp.length;i+=2){o+=trChunk(sp[i])+(sp[i+1]||'');}return o;}
  const parts=m.split(/([ \u00A0,.:;!?()\-\/]+)/);const words=[],seps=[];
  parts.forEach((p,i)=>{(i%2?seps:words).push(p);});
  let out='',i=0;
  while(i<words.length){
    let done=false;
    for(let n=Math.min(8,words.length-i);n>=1;n--){
      let key=words[i];for(let j=1;j<n;j++)key+=seps[i+j-1]+words[i+j];
      let r=DICT[key];if(r===undefined&&n===1)r=trWord(words[i]);
      if(r!==undefined&&r!==null){out+=(i>0?seps[i-1]:'')+r;i+=n;done=true;break;}
    }
    if(!done){out+=(i>0?seps[i-1]:'')+words[i];i++;}
  }
  return out;
}

/* ---------- invoice reading animation ---------- */
function matchSummary(t,files){const g=tripGaps(t).filter(x=>x.s.k==='gap'&&x.usd>0&&isOpenGap(x.s));return {files,n:g.length,amt:r2(g.reduce((a,x)=>a+x.usd,0))};}
function startReading(t){
  if(S.reading||!t.inbox.length)return;
  S.reading={tid:t.id,done:[],n:t.inbox.length};render();
  const tick=()=>{
    if(!S.reading||S.reading.tid!==t.id||byId(t.id)!==t)return; // demo reset mid-read
    const f=t.inbox.shift();if(!f){const n=S.reading.n;S.reading=null;S.lastMatch[t.id]=matchSummary(t,n);render();const s=S.lastMatch[t.id];toast(L(`נמצאו ${s.n} פערים בסך ${usd(s.amt)}`,`Found ${s.n} gaps worth ${usd(s.amt)}`));return;}
    applyInboxFile(t,f);
    const lines=(f.inv||[]).length+(f.extra||[]).length,gaps=(f.inv||[]).filter(x=>x[1].kind).length+(f.extra||[]).length;
    S.reading.done.push({file:f.file,lines,gaps});render();setTimeout(tick,650);
  };
  setTimeout(tick,500);
}

const LY={Priya:.62,Dana:.7,Marcus:.45,Grace:.55,Luis:.6,Tom:.5};
function vHome(){
  const ts=visibleTrips();if(!ts.length)return noTrip();
  const c=f=>ts.filter(f).length,P=portfolio(ts),G=gapStats(ts);
  const qL=n=>L('הצעות',n===1?'quote':'quotes'),fL=n=>L('תיקים',n===1?'file':'files');
  const n1=c(t=>t.stage==='Quote'&&(t.qst||'Draft')==='Draft'),n2=c(t=>t.stage==='Quote'&&(t.qst||'Draft')!=='Draft'),n3=c(t=>t.stage==='Operations'),n4=c(t=>t.stage==='Finance'),n5=c(t=>t.stage==='Closed');
  const tiles=[[L('סך הכל','Total'),ts.length,L('הצעות ותיקים','quotes and files'),'','▤'],[L('בבנייה','In progress'),n1,qL(n1),'orange','✎'],[L('ממתינות','Pending'),n2,qL(n2),'amber','⏳'],[L('בתפעול','In operations'),n3,fL(n3),'blue','⚙'],[L('סגירה כספית','Financial close'),n4,fL(n4),'purple','$'],[L('נסגרו','Closed'),n5,fL(n5),'green','✓']];
  const tl=tiles.map(x=>`<div class="tile"><span class="ring" style="${x[3]?`--c:var(--${x[3]})`:''}">${x[4]}</span><div><div class="l">${x[0]}</div><div class="s">${x[1]} ${x[2]}</div></div></div>`).join('');
  const up=ts.filter(t=>D(t.dep)>=TODAY).sort((a,b)=>D(a.dep)-D(b.dep)).slice(0,7);
  let lastD='',ev='';
  up.forEach(t=>{if(t.dep!==lastD){lastD=t.dep;ev+=`<div class="evh">${fmtDate(t.dep)}</div>`;}
    ev+=`<div class="ev"><span class="dot" style="background:var(--${stCls(t.stage)})"></span><a href="#" data-act="open" data-v="${t.id}" style="flex:1;color:inherit;text-decoration:none">${esc(t.name)}</a><span class="muted small">${range(t)}</span></div>`;});
  const won=c(t=>t.stage!=='Quote'),lost=S.role==='manager'?3:0;
  const H=[['2023',9,4],['2024',11,5],['2025',12,3],['2026',won,lost]];
  const mx=Math.max(...H.map(h=>Math.max(h[1],h[2])),1);
  const bars=H.map(h=>`<div class="col"><div class="bars"><div class="b won" style="height:${h[1]/mx*100}%"><i>${h[1]}</i></div><div class="b lost" style="height:${Math.max(h[2]/mx*100,2)}%"><i>${h[2]}</i></div></div></div>`).join('');
  const labs=H.map(h=>`<span>${h[0]}</span>`).join('');
  const chg=S.role==='manager'?`${sgn(Math.round((won-12)/12*100),v=>v)}% ${L('ביחס לשנה קודמת','vs last year')}`:'';
  const latest=ts.slice().sort((a,b)=>b.no-a.no).slice(0,5).map(t=>{
    const ring=t.stage==='Operations'?(()=>{const d=t.tasks.filter(x=>x.done).length;return `<div class="pr" style="--p:${Math.round(d/t.tasks.length*100)}"><span>${d}/${t.tasks.length}</span></div>`;})():t.stage!=='Quote'?'<span class="okc">✓</span>':'';
    return `<tr><td><strong>${esc(t.name)}</strong><div class="small muted">${sn(t.seg)}</div></td><td>${esc(t.client)}<div class="small muted">${ctn(t.ctype)}</div></td><td>${range(t)}<div class="small muted">${nightsL(t.nights)}</div></td><td>${agn(t.agent)}</td><td>${qchip(t)}</td><td>${ring}</td><td><button class="btn sm" data-act="open" data-v="${t.id}" aria-label="${L('פתח','Open')}">›</button></td></tr>`;}).join('');

function pPlan(t){

    ${l?`<span class="cbox">${L('עלות לאדם','Cost per person')} $<input type="number" min="0" step="1" data-ch="itemcost" data-v="${l.id}" value="${Math.round(l.cost*lrate(t,l))}" aria-label="${L('עלות לאדם','Cost per person')}"></span>`:''}
    <select data-ch="mv" data-v="${i.id}" aria-label="${L('העבר ליום','Move to day')}">${[...Array(t.nights+2).keys()].map(k=>`<option value="${k}" ${k===i.day?'selected':''}>${k===0?L('לא משובץ','Unscheduled'):L('יום ','Day ')+k}</option>`).join('')}</select>
    <button class="btn sm" data-act="rmitem" data-v="${i.id}" aria-label="${L('הסר','Remove')}">✕</button></div>`;};
  const acts=DESTS[t.dest].acts;

      <div style="font-weight:700;margin-bottom:4px">${d===0?L('אתרים שלא שובצו','Unscheduled sites'):L('אתרים ביום הטיול','Sites on this day')}</div>${its.map(siteRow).join('')||`<p class="muted small">${L('אין אתרים. גררו לכאן או הוסיפו.','No sites yet. Drag one here or add one.')}</p>`}

/* ---------- cost table ---------- */
function pCosts(t){
  const c=calc(t),cs=t.cur,usdOnly=cs==='USD';
  const sect=(sk)=>{
    const sh=sk==='s';
    const types=TYPES.filter(ty=>c.lines.some(x=>!x.l.extra&&x.l.type===ty&&(x.l.scope==='shared')===sh));
    let tot=0;
    const rows=types.map(ty=>{
      const ls=c.lines.filter(x=>!x.l.extra&&x.l.type===ty&&(x.l.scope==='shared')===sh),key=sk+'|'+ty,d=t.disc[key]||{m:'%',v:''};
      const cost=ls.reduce((a,x)=>a+x.planUSD,0),price=ls.reduce((a,x)=>a+x.price,0),da=c.discBy[key]||0,total=price-da;tot+=total;
      const ovN=ls.filter(x=>x.l.ov!==''&&x.l.ov!=null).length,op=S.openT[key],mkv=t.markups[ty];
      let r=`<tr><td><span class="type"><i style="background:${TCOL[ty]}">${TICO[ty]}</i>${tn(ty)}</span><button class="btn sm" style="margin-inline-start:8px" data-act="tt" data-v="${key}" aria-label="${L('פירוט שורות','Line detail')}">${op?'⌃':'⌄'}</button></td>
        <td class="n">${usd(sh?cost:cost/t.pax,sh?0:2)}</td>
        <td class="n"><span class="inl"><select disabled aria-label="${L('סוג מרקאפ','Markup type')}"><option>%</option></select><input type="number" min="0" max="90" data-ch="mk" data-v="${ty}" value="${mkv}" aria-label="${L('מרקאפ','Markup')} ${tn(ty)}"></span>${ovN?`<div class="small muted">${ovN} ${L('חריגות','overrides')}</div>`:''}</td>
        <td class="n"><span class="inl"><select data-ch="dm" data-k="${key}" aria-label="${L('סוג הנחה','Discount type')}"><option value="%" ${d.m==='%'?'selected':''}>%</option><option value="$" ${d.m==='$'?'selected':''}>$</option></select><input type="number" min="0" data-ch="dv" data-k="${key}" value="${d.v}" aria-label="${L('הנחה','Discount')} ${tn(ty)}"></span></td>
        <td class="n"><strong>${usd(sh?total:total/t.pax,sh?0:2)}</strong></td></tr>`;
      if(op)r+=`<tr><td colspan="5" style="background:var(--recess)"><table class="tbl"><thead><tr><th>${L('שירות','Service')}</th><th>${L('ספק','Supplier')}</th><th class="n">${L('כמות','Qty')}</th><th class="n">${L('עלות יחידה','Unit cost')}</th><th class="n">${L('עלות','Cost')}</th><th class="n">${L('מרקאפ חריג','Markup override')}</th><th class="n">${L('מחיר $','Price $')}</th></tr></thead><tbody>${ls.map(x=>`<tr><td>${esc(x.l.name)}</td><td>${esc(x.l.sup)}</td><td class="n">${x.l.qty} ${x.l.unit}</td><td class="n"><span class="small muted">${x.l.cur}</span> <input type="number" min="0" step="1" data-ch="cost" data-v="${x.l.id}" value="${x.l.cost}" aria-label="${L('עלות יחידה','Unit cost')}"></td><td class="n">${money(planC(x.l),x.l.cur)}</td><td class="n"><input type="number" min="0" max="90" placeholder="${mkv}" data-ch="ov" data-v="${x.l.id}" value="${x.l.ov}" aria-label="${L('מרקאפ חריג','Markup override')}"></td><td class="n">${usd(x.price,2)}</td></tr>`).join('')}</tbody></table></td></tr>`;
      return r;}).join('');
    return {rows,tot,has:types.length>0};
  };
  const a=sect('s'),b=sect('p');
  const ex=t.basis==='cost'?L(`מרקאפ 25% על העלות הוא שולי רווח של ${pct(.25/1.25)} מהמחיר.`,`A 25% markup on cost is a ${pct(.25/1.25)} margin on price.`):L(`מרקאפ 25% מהמחיר פירושו מחיר שווה לעלות חלקי 0.75, כלומר ${pct(.25/.75)} מעל העלות.`,`A 25% markup of price means price equals cost divided by 0.75, that is ${pct(.25/.75)} above cost.`);
  const th=(first,lbl)=>`<thead><tr><th>${first}</th><th class="n">${lbl}</th><th class="n">Mark up</th><th class="n">Discount</th><th class="n">Total</th></tr></thead>`;
  return master(t,`<button class="btn pri" data-act="pt" data-v="quote">${L('צור הצעת מחיר','Create proposal')}</button>`)+`
  <div class="stats"><div class="stat"><div class="l">${L('מחיר ללקוח','Client price')}</div><div class="v">${usd(c.rev)}</div><div class="s">${usd(c.rev/t.pax,2)} ${L('לנוסע','per traveler')}</div></div><div class="stat"><div class="l">${L('עלות מתוכננת','Planned cost')}</div><div class="v">${usd(c.plan)}</div></div><div class="stat"><div class="l">${L('רווח מתוכנן','Planned profit')}</div><div class="v">${usd(c.planProfit)}</div><div class="s">${pct(c.planProfit/c.rev)} ${L('מהמחיר, כולל עמלות','of price, incl. commission')}</div></div><div class="stat"><div class="l">${L('עמלת ספקים צפויה','Expected supplier commission')}</div><div class="v">${usd(c.comm)}</div><div class="s">${L('לא מוצגת ללקוח','not shown to client')}</div></div>${c.disc?`<div class="stat"><div class="l">${L('הנחות','Discounts')}</div><div class="v">${usd(c.disc)}</div></div>`:''}</div>
  <div class="card sec"><div class="row" style="justify-content:space-between"><div class="row"><strong>${L('המרקאפ מחושב','Markup is calculated')}</strong><div class="row"><button class="btn sm ${t.basis==='cost'?'pri':''}" data-act="basis" data-v="cost">${L('על העלות','On cost')}</button><button class="btn sm ${t.basis==='price'?'pri':''}" data-act="basis" data-v="price">${L('מהמחיר','Of price')}</button></div></div>
    ${usdOnly?'':`<label class="row small muted">${L(`שער נעול, דולר ל-${cs}`,`Locked rate, USD per ${cs}`)}<input type="number" step="0.01" min="0.5" max="2" data-ch="rate" value="${t.rate}" aria-label="${L('שער נעול','Locked rate')}"></label>`}</div><p class="small muted" style="margin:8px 0 0">${usdOnly?L('כל הספקים בטיול הזה מחייבים בדולרים, אז אין חשיפה לשער חליפין.','Every supplier on this trip bills in USD, so there is no exchange-rate exposure.'):L(`עלויות הספקים ב-${cs} (טיסות וביטוח בדולרים), והמחיר ללקוח בדולרים לפי השער הנעול.`,`Supplier costs are in ${cs} (air and travel protection in USD); the client price is in dollars at the locked rate.`)} ${ex}</p></div>
  ${a.has?`<div class="card sec"><h3>${L('הוצאות משותפות','Shared expenses')}</h3><div class="scroll"><table class="tbl">${th(L('סוג השירות','Service type'),'Tot Global')}<tbody>${a.rows}</tbody><tfoot><tr><td>${L('סה"כ','Total')}</td><td></td><td></td><td></td><td class="n">${usd(a.tot)}</td></tr></tfoot></table></div></div>`:''}
  ${b.has?`<div class="card sec"><h3>${L('הוצאות פר אדם','Per-person expenses')}</h3><div class="scroll"><table class="tbl">${th(L('סוג השירות','Service type'),'Tot PP')}<tbody>${b.rows}</tbody><tfoot><tr><td>${L('סה"כ לאדם','Total per person')}</td><td></td><td></td><td></td><td class="n">${usd(b.tot/t.pax,2)}</td></tr><tr><td>${paxL(t.pax)}</td><td></td><td></td><td></td><td class="n">${usd(b.tot)}</td></tr></tfoot></table></div></div>`:''}`;
}

/* ---------- proposal document ---------- */
function pQuote(t){
  const c=calc(t),days=[...Array(t.nights+1).keys()].map(k=>k+1),owner=AGE[t.agent]||t.agent;
  const hues=['#1e6f7c','#b87a3a','#3b6fa5','#6a8f3a','#8a5aa8'];
  const dc=days.map(d=>{const dd=addDays(t.dep,d-1),its=t.items.filter(i=>i.day===d);return `<div class="dc"><div class="dimg" style="background:linear-gradient(135deg,${hues[d%5]},#e8c08a)"></div><b>DAY ${d}</b><div style="color:#667">${D(dd).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</div><ul style="margin:6px 0 0;padding-left:18px">${its.map(i=>`<li>${esc(i.name)}</li>`).join('')||'<li>Free day</li>'}</ul></div>`;}).join('');
  const dep=r2(c.rev*t.pct/100);
  const sw=(k,l)=>`<label class="sw"><input type="checkbox" data-ch="sw" data-v="${k}" ${S[k]?'checked':''}>${l}</label>`;
  return master(t,`<span class="pill">PDF</span><span class="pill">🔒 slideshow</span><span class="pill">🔒 landing page</span><button class="btn" data-act="print">🖨 ${L('הדפסה / PDF','Print / PDF')}</button>`)+`<div class="pg rev" style="grid-template-columns:320px minmax(0,1fr)"><div class="doc"><div class="hero"><div class="logo"><span>R</span>${AGENCY}</div><h2>${esc(t.name)}</h2><div class="meta">${t.dep.slice(5,7)}/${t.dep.slice(8)}/${t.dep.slice(2,4)} - ${endOf(t).slice(5,7)}/${endOf(t).slice(8)}/${endOf(t).slice(2,4)} | ${t.nights+1} days, ${t.nights} nights | ${DESTS[t.dest].country} | ${t.pax} travelers</div><div class="meta" style="margin-top:12px">Sent by ${esc(owner)} on ${D(iso(TODAY)).toLocaleDateString('en-US')}</div></div>
    <div class="intro">Hello everyone and welcome! We are excited to host ${esc(t.client)} for a ${t.nights+1}-day journey to ${DESTS[t.dest].en}. This proposal covers the daily schedule, what is included and the price per traveler.</div>
    <div class="body"><h3>Itinerary</h3><div class="days">${dc}</div>
    ${S.showPP?`<h3 style="margin-top:18px">Price</h3><table><tr><td>Price per traveler</td><td><strong>${usd(c.rev/t.pax,2)}</strong></td></tr><tr><td>Group total (${t.pax} travelers)</td><td><strong>${usd(c.rev,2)}</strong></td></tr></table>`:''}
    ${S.showItems?`<h3 style="margin-top:18px">What is included</h3><ul>${TYPES.filter(ty=>c.byType[ty]).map(ty=>`<li>${({Lodging:'Hotel accommodation',Transport:DESTS[t.dest].air?'Group air and ground transportation':'Motorcoach transportation',Guide:'Professional guide',Activities:'Activities and entrances',Meals:'Group meals',Insurance:'Travel protection'})[ty]}</li>`).join('')}</ul>`:''}
    ${S.showSched?`<h3 style="margin-top:18px">Payment schedule</h3><table><tr><td>Deposit ${t.pct}% (due ${D(t.depDue).toLocaleDateString('en-US')})</td><td>${usd(dep,2)}</td></tr><tr><td>Balance (due ${D(t.balDue).toLocaleDateString('en-US')})</td><td>${usd(r2(c.rev-dep),2)}</td></tr></table>`:''}
    <p style="font-size:12px;color:#667;margin:14px 0 0">${AGENCY} · ${AGENCY_CITY} · fictional company for demonstration</p></div></div>
    <div class="card" style="order:-1"><h3>⚙ ${L('הגדרת קובץ','File settings')}</h3>${sw('showPP',L('הצג מחיר לנוסע וסך לקבוצה','Show price per traveler and group total'))}${sw('showItems',L('הצג מה כלול במחיר',"Show what's included"))}${sw('showSched',L('הצג לוח תשלומים','Show payment schedule'))}<p class="small muted">${L('עמלות ספקים ושולי רווח אף פעם לא מופיעים במסמך ללקוח.','Supplier commissions and margins never appear in the client document.')}</p>
    <div class="row" style="margin-top:12px"><button class="btn" data-act="pt" data-v="approve">${L('לשלב אישור ההצעה','To quote approval')}</button></div></div></div>`;
}

/* ---------- approval ---------- */
function pApprove(t){
  const steps=[['Draft',L('בבנייה','In progress')],['Approval',L('לאישור מנהל','Manager approval')],['Sent',L('נשלח ללקוח','Sent to client')],['Negotiating',L('ממתין לסגירה','Awaiting close')]];
  const cur=t.stage==='Quote'?steps.findIndex(s=>s[0]===(t.qst||'Draft')):4,c=calc(t);
  const st=steps.map((s,i)=>`<div class="tile" style="border:0"><span class="ring" style="--c:var(--${i<cur?'green':i===cur?'blue':'muted'})">${i<cur?'✓':i+1}</span><div class="l">${s[1]}</div></div>`).join('')+`<div class="tile" style="border:0"><span class="ring" style="--c:var(--${cur>=4?'green':'muted'})">${cur>=4?'✓':5}</span><div class="l">${L('תיק נפתח','File opened')}</div></div>`;
  let act='';
  if(t.stage!=='Quote')act=`<p>${L('ההצעה אושרה והתיק פעיל.','The quote is accepted and the file is live.')}</p><button class="btn" data-act="pt" data-v="ops">${L('לתפעול','To operations')}</button>`;
  else if((t.qst||'Draft')==='Draft')act=`<button class="btn pri" data-act="qs" data-v="Approval">${L('שלח לאישור מנהל','Send for manager approval')}</button>`;
  else if(t.qst==='Approval')act=S.role==='manager'?`<p>${L(`ההצעה ממתינה לאישורך. מחיר ${usd(c.rev)}, רווח מתוכנן ${pct(c.planProfit/c.rev)}.`,`The quote is waiting for your approval. Price ${usd(c.rev)}, planned margin ${pct(c.planProfit/c.rev)}.`)}</p><button class="btn grn" data-act="qs" data-v="Sent">${L('אשר ושלח ללקוח','Approve and send to client')}</button>`:`<p class="muted">${L('ההצעה ממתינה לאישור מנהל. רק מנהל יכול לאשר ולשלוח.','The quote is waiting for manager approval. Only a manager can approve and send it.')}</p>`;
  else if(t.qst==='Sent')act=`<p>${L(`ההצעה נשלחה ללקוח לפני ${t.qdays} ימים.`,`The quote was sent to the client ${t.qdays} days ago.`)}</p><button class="btn" data-act="qs" data-v="Negotiating">${L('הלקוח ביקש לסגור','Client asked to close')}</button>`;
  else act=`<p>${L('הלקוח מוכן לסגור.','The client is ready to close.')}</p>`;
  if(t.stage==='Quote'&&(t.qst==='Sent'||t.qst==='Negotiating'))act+=` <button class="btn grn" data-act="win" data-v="${t.id}">${L('הלקוח אישר: פתח תיק','Client accepted: open the file')}</button>`;
  return master(t)+`<div class="card appr"><div class="tiles" style="border:0;margin-bottom:6px">${st}</div><div class="row" style="padding:6px 4px">${act}</div></div>`;
}

/* ---------- operations ---------- */
function pOps(t){
  if(t.stage==='Quote')return gate(t,L('תפעול','Operations'));
  const od=t.tasks.filter(x=>!x.done&&D(x.due)<TODAY),dn2=t.tasks.filter(x=>x.done).length,op=t.tasks.filter(x=>!x.done&&D(x.due)>=TODAY).length;
  const who=w=>w==='Ops desk'?L('מחלקת תפעול','Ops desk'):agn(w);
  const tasks=t.tasks.map(x=>{const o=!x.done&&D(x.due)<TODAY;return `<tr><td><input type="checkbox" data-ch="task" data-v="${x.id}" ${x.done?'checked':''} aria-label="${esc(x.t)}"></td><td>${esc(x.t)}</td><td>${who(x.who)}</td><td>${fmtDate(x.due)}</td><td>${x.done?pillF(L('בוצע','Done'),'green'):o?pillF(L('באיחור','Overdue'),'red'):pillF(L('פתוח','Open'),'blue')}</td></tr>`;}).join('');
  const sups=t.sups.map((s,i)=>`<tr><td>${esc(s.n)}</td><td>${tn(s.cat)}</td><td><button class="btn sm" data-act="cyc" data-v="${i}">${pillF(supn(s.st),supCls(s.st))}</button></td></tr>`).join('');
  const k=Math.min(S.msgSup,t.sups.length-1),sp=t.sups[k],ln=t.lines.find(l=>l.id===sp.line);
  const msg=`Hello ${sp.n} team,\n\nPlease confirm the booking for our group of ${t.pax} travelers (${t.client}, arriving ${D(t.dep).toLocaleDateString('en-US')}): ${ln.name}, ${ln.qty} ${ln.unit} at ${money(ln.cost,ln.cur)}. A reply with your confirmation number and invoice details is all we need.\n\nThank you,\n${AGE[t.agent]}\n${AGENCY}`;
  const rm=t.room;
  return master(t)+`<div class="two"><div class="card"><h3>${L('תקציר יומי למנהלים','Daily manager digest')}</h3><p style="font-size:17px;font-weight:600">${L(`מחר: ${od.length} משימות באיחור, ${dn2} הושלמו, ${op} פתוחות.`,`Tomorrow: ${od.length} overdue tasks, ${dn2} done, ${op} open.`)}</p><p class="small muted">${od.length?L('באיחור: ','Overdue: ')+od.map(x=>esc(x.t)).join('; ')+'. ':L('אין משימות באיחור. ','No overdue tasks. ')}${L('נבנה מרשימת המשימות למטה.','Built from the task list below.')}</p></div>
  <div class="card"><h3>${L('בלוק חדרים במלון','Hotel room block')}</h3><p class="small muted">${esc(rm.hotel)}, ${fmtDate(t.dep)}</p><div class="prog"><div style="width:${rm.used/rm.held*100}%"></div></div><p class="small" style="margin-top:8px">${L(`${rm.used} מתוך ${rm.held} חדרים נוצלו מהבלוק. ${rm.held-rm.used} ניתנים לשחרור.`,`${rm.used} of ${rm.held} rooms used from the block. ${rm.held-rm.used} can be released.`)}</p></div></div>
  <div class="sec card"><h3>${L('רשימת משימות','Task list')}</h3><div class="scroll tall"><table class="tbl"><thead><tr><th></th><th>${L('משימה','Task')}</th><th>${L('אחראי','Owner')}</th><th>${L('דד-ליין','Due')}</th><th>${L('סטטוס','Status')}</th></tr></thead><tbody>${tasks}</tbody></table></div></div>
  <div class="two"><div class="card"><h3>${L('אישורי ספקים','Supplier confirmations')}</h3><p class="small muted">${L('לחצו על סטטוס כדי לשנות אותו.','Click a status to change it.')}</p><div class="scroll"><table class="tbl"><thead><tr><th>${L('ספק','Supplier')}</th><th>${L('קטגוריה','Category')}</th><th>${L('סטטוס','Status')}</th></tr></thead><tbody>${sups}</tbody></table></div></div>
  <div class="card"><h3>${L('תבנית הודעה לספק','Supplier message template')}</h3><label class="row small muted">${L('ספק','Supplier')} <select data-ch="msgsup">${t.sups.map((s,i)=>`<option value="${i}" ${i===k?'selected':''}>${esc(s.n)}</option>`).join('')}</select></label>
  <pre class="mail">${esc(msg)}</pre><button class="btn" data-act="copymsg">${L('העתק הודעה','Copy message')}</button></div></div>`;
}

/* ---------- travelers and billing ---------- */
function pPeople(t){
  if(t.stage==='Quote')return gate(t,L('נוסעים וחיוב','Travelers & billing'));
  const g=groupsCalc(t),c=calc(t),intl=DESTS[t.dest].intl;
  const shared=c.lines.filter(x=>x.l.scope==='shared').reduce((a,x)=>a+x.price,0);
  const rows=g.rows.map(r=>{const st=r.balPaid&&r.depPaid?pillF(L('שולם במלואו','Paid in full'),'green'):r.late>0?pillF(r.days===1?L('יום איחור','1 day late'):L(r.days+' ימי איחור',r.days+' days late'),'red'):r.depPaid?pillF(L('מקדמה שולמה','Deposit paid'),'blue'):pillF(L('טרם הגיע המועד','Not due yet'),'');
    return `<tr><td>${esc(r.name)}</td><td class="n">${r.size}</td><td class="n">${usd(r.amt,2)}</td><td class="n">${usd(r.paid,2)}</td><td class="n">${usd(r.open,2)}</td><td>${st}</td><td><button class="btn sm" data-act="link" data-v="${r.name.replace(/\W/g,'')}">${L('העתק קישור תשלום','Copy payment link')}</button></td></tr>`;}).join('');
  const dietN=t.trav.filter(x=>x.diet!=='None').length,passN=t.trav.filter(x=>x.pass==='Missing').length;
  const docL=intl?L('דרכון','Passport'):L('טופס חירום','Emergency form');
  const trav=t.trav.map(x=>`<tr><td>${x.room}</td><td>${esc(x.n)}</td><td>${esc(x.g)}</td><td>${dietn(x.diet)}</td><td>${x.pass==='Received'?pillF(L('התקבל','Received'),'green'):pillF(L('חסר','Missing'),'amber')}</td></tr>`).join('');
  return master(t)+`<p class="muted">${L('כל משק בית משלם עבור הנוסעים שלו בקישור אישי. הסכומים תמיד מתחברים למחיר ללקוח.','Each household pays for its own travelers through a personal link. The amounts always add up to the client price.')}</p>
  <div class="two"><div class="card"><h3>${L('איך מתחלקות העלויות המשותפות','How shared costs are split')}</h3><p>${L(`העלויות המשותפות (חדרים, אוטובוס, העברות, מדריך) מסתכמות ב-${usd(shared,2)} במחיר. הן מתחלקות שווה בשווה, כך שכל נוסע נושא ${usd(shared/t.pax,2)}.`,`Shared costs (rooms, coach, transfers, guide) come to ${usd(shared,2)} in the price. They are split equally, so each traveler carries ${usd(shared/t.pax,2)}.`)}</p><p class="small muted">${L('עלויות פר אדם, כמו טיסה, כרטיסים וארוחות, מחויבות לכל אחד ישירות.','Per-person costs such as air, tickets and meals are charged to each traveler directly.')}</p></div>

function hbar(label,a,b,mx,tail){return `<div class="hbar"><span>${label}</span><div><div class="t"><div style="width:${Math.max(0,a/mx*100)}%;background:var(--muted);opacity:.55"></div></div><div class="t"><div style="width:${Math.max(0,b/mx*100)}%;background:var(--teal)"></div></div></div><span class="small hv">${tail||usd(a)+' / '+usd(b)}</span></div>`;}

  return `Subject: Invoice ${i.no} - request for a credit note\n\nHello ${l.sup} team,\n\nThank you for hosting ${t.client} (${t.name}, ${D(t.dep).toLocaleDateString('en-US')} - ${D(endOf(t)).toLocaleDateString('en-US')}). Reviewing invoice ${i.no} against our confirmed booking, we found a difference:\n\n- ${ex.replace(/&quot;/g,'"')}\n- Contracted: ${mm(planC(l))}. Invoiced: ${mm(i.amt)}. Difference: ${mm(diff)}.\n\nCould you please issue a credit note for ${mm(diff)} or send a corrected invoice? We are happy to share the signed contract and the final rooming list.\n\nThank you,\n${AGE[t.agent]}\n${AGENCY}, ${AGENCY_CITY}`;

/* ---------- invoice check, all trips ---------- */
function vGaps(){
  const ts=visibleTrips();if(!ts.length)return noTrip();
  const G=gapStats(ts);
  const kinds=['rooms','qty','rate','comp','extra','dup','under'];
  const stOf=x=>x.s.k==='credited'?'credited':x.s.st;
  const list=G.list.filter(x=>(S.gF==='all'||(stOf(x)===S.gF&&!(S.gF==='open'&&x.usd<0&&S.gK!=='under')))&&(S.gK==='All'||kindOf(x.l,x.s)===S.gK)).sort((a,b)=>Math.abs(b.usd)-Math.abs(a.usd));
  const kmx=Math.max(...Object.values(G.byKind).map(b=>b.amt),1);
  const byKind={};G.list.forEach(x=>{if(x.orig<=0)return;const k=kindOf(x.l,x.s),b=byKind[k]||(byKind[k]={n:0,amt:0});b.n++;b.amt=r2(b.amt+x.orig);});
  const kbars=kinds.filter(k=>byKind[k]).sort((a,b)=>byKind[b].amt-byKind[a].amt).map(k=>`<div class="hbar"><span>${kindL(k)}</span><div class="t"><div style="width:${byKind[k].amt/kmx*100}%;background:var(--red);opacity:.75"></div></div><span class="small hv">${usd(byKind[k].amt)} · ${byKind[k].n}</span></div>`).join('');
  const sup=Object.entries(G.bySup).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.trips.size}</td><td class="n">${v.n}</td><td class="n neg">${usd(v.amt)}</td><td class="n pos">${usd(v.rec)}</td></tr>`).join('');
  const rows=list.map(x=>{const st=stOf(x),k=kindOf(x.l,x.s);return `<tr><td><a href="#" data-act="open" data-v="${x.t.id}" data-pt="tfin" style="color:var(--blue)">${esc(x.t.name)}</a><div class="small muted">${stn(x.t.stage)}</div></td><td>${esc(x.l.sup)}<div class="small muted">${esc(x.l.inv.no)}</div></td><td>${kindPill(k)}</td><td class="n ${x.orig>0?'neg':'pos'}">${sgn(x.orig,v=>usd(v))}</td><td>${gstPill(st)}</td></tr>`;}).join('');
  const rate=G.received?G.matched/G.received:0;
  const sel=(k,arr,v)=>`<select data-ch="${k}">${arr.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  return head(L('בקרת חשבוניות','Invoice check'),pillF(L('חדש','New'),'green'))+`<p class="muted">${L('כל חשבונית ספק מותאמת למה שתומחר בהצעה. פערים נמצאים לבד ונשארים במעקב עד שמתקבל זיכוי או שהחיוב מאושר.','Every supplier invoice is matched to what you quoted. Gaps are found automatically and tracked until they are credited or accepted.')}</p>

/* ---------- finance dashboard ---------- */
function vFinance(){
  let ts=visibleTrips();if(!ts.length)return noTrip();
  const segs=['All',...Object.keys(SEG)],stages=['All','Operations','Finance','Closed'],agents=['All',...AGENTS];
  ts=ts.filter(t=>(S.fSeg==='All'||t.seg===S.fSeg)&&(S.fStage==='All'||t.stage===S.fStage||t.stage==='Quote')&&(S.fAgent==='All'||t.agent===S.fAgent));
  const sel=(k,arr,v,lab)=>`<select data-ch="${k}">${arr.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x==='All'?L('הכל','All'):lab(x)}</option>`).join('')}</select>`;
  const filt=`<div class="row sec"><label class="row small muted">${L('סוג קבוצה','Group type')} ${sel('fseg',segs,S.fSeg,sn)}</label><label class="row small muted">${L('שלב','Stage')} ${sel('fstage',stages,S.fStage,stn)}</label>${S.role==='manager'?`<label class="row small muted">${L('סוכן','Agent')} ${sel('fagent',agents,S.fAgent,agn)}</label>`:''}<label class="row small muted">${L('קו התראה לשולי רווח','Margin alert line')} <input type="number" min="0" max="50" data-ch="thresh" value="${S.thresh}" aria-label="${L('קו התראה','Alert line')}">%</label></div>`;
  const P=portfolio(ts);
  if(!P.rows.length)return head(L('כספים','Finance'))+filt+`<div class="card"><p class="muted">${L('אין טיולים שהוזמנו בסינון הזה.','No booked trips in this filter.')} ${P.pipelineN?L(`${P.pipelineN} הצעות (${usd(P.pipeline)}) נחשבות צנרת ולא הכנסה.`,`${P.pipelineN} quotes (${usd(P.pipeline)}) count as pipeline, not revenue.`):''}</p></div>`;
  const rows=[...P.rows].sort((a,b)=>D(a.t.dep)-D(b.t.dep));
  const mx=Math.max(...rows.map(r=>Math.max(r.pp,r.fp)),1);
  const bars=rows.map(r=>`<div class="col"><div class="bars"><div class="b plan" style="height:${Math.max(r.pp/mx*100,1)}%"><i>${kf(r.pp)}</i></div><div class="b fc" style="height:${Math.max(r.fp/mx*100,1)}%"><i>${kf(r.fp)}</i></div></div></div>`).join('');
  const SH={HolyLand:['ארץ הקודש','Holy Land'],Washington:['וושינגטון','DC'],NewEngland:['ניו אינגלנד','New England'],Canyon:['גרנד קניון','Canyon'],Rome:['רומא','Rome'],Greece:['יוון','Greece'],Niagara:['ניאגרה','Niagara'],London:['לונדון','London'],Ireland:['אירלנד','Ireland'],Branson:['ברנסון','Branson'],Nashville:['נאשוויל','Nashville']};
  const labs=rows.map(r=>`<span>${L(SH[r.t.dest][0],SH[r.t.dest][1])}<br><small>${r.t.dep.slice(5,7)}/${r.t.dep.slice(2,4)}</small></span>`).join('');
  const cm=Math.max(...MONTHS.map(k=>Math.max(P.cash[k].in,P.cash[k].out)),1);
  const cbars=MONTHS.map(k=>`<div class="col"><div class="bars"><div class="b in" style="height:${Math.max(P.cash[k].in/cm*100,1)}%"><i>${kf(P.cash[k].in)}</i></div><div class="b out" style="height:${Math.max(P.cash[k].out/cm*100,1)}%"><i>${kf(P.cash[k].out)}</i></div></div></div>`).join('');
  const clabs=MONTHS.map(k=>`<span>${monthLabel(k)}</span>`).join('');
  const inT=MONTHS.reduce((a,k)=>a+P.cash[k].in,0),outT=MONTHS.reduce((a,k)=>a+P.cash[k].out,0);
  const agL=[L('1 עד 30 ימים','1 to 30 days'),L('31 עד 60 ימים','31 to 60 days'),L('מעל 60 ימים','Over 60 days')].map((l,i)=>`<tr><td>${l}</td><td class="n">${P.agingN[i]}</td><td class="n">${usd(P.aging[i])}</td></tr>`).join('');
  const prof=(obj,lab)=>{const ks=Object.keys(obj).sort((a,b)=>obj[b].fp/obj[b].pax-obj[a].fp/obj[a].pax);const mxv=Math.max(...ks.map(k=>obj[k].fp/obj[k].pax),1);
    return ks.map(k=>`<div class="hbar"><span>${lab(k)}</span><div class="t"><div style="width:${Math.max(0,obj[k].fp/obj[k].pax/mxv*100)}%;background:var(--teal)"></div></div><span class="small hv">${usd(obj[k].fp/obj[k].pax)} | ${pct(obj[k].fp/obj[k].rev)}</span></div>`).join('');};
  const fxk=Object.keys(P.fxExp);
  const fx=fxk.map(k=>{const e=P.fxExp[k],imp=r2(e.usd*S.shock/100);return `<tr><td>${k}</td><td class="n">${money(e.amt,k)}</td><td class="n">${usd(e.usd)}</td><td class="n ${imp>0?'neg':'pos'}">${sgn(-imp,v=>usd(v))}</td></tr>`;}).join('');
  const fxTot=r2(Object.values(P.fxExp).reduce((a,e)=>a+e.usd*S.shock/100,0));
  const rank=[...P.rows].sort((a,b)=>b.fp/b.t.pax-a.fp/a.t.pax).map(r=>`<tr><td><a href="#" data-act="open" data-v="${r.t.id}" data-pt="tfin" style="color:var(--blue)">${esc(r.t.name)}</a></td><td>${sn(r.t.seg)}</td><td>${pillF(stn(r.t.stage),stCls(r.t.stage))}</td><td class="n">${r.t.pax}</td><td class="n">${usd(r.c.rev)}</td><td class="n">${usd(r.pp)}</td><td class="n">${usd(r.fp)}</td><td class="n ${r.fp<r.pp?'neg':'pos'}">${sgn(r2(r.fp-r.pp),usd)}</td><td class="n">${pct(r.fp/r.c.rev)}</td><td class="n">${usd(r.fp/r.t.pax)}</td></tr>`).join('');
  const late=[...P.lateGroups].sort((a,b)=>b.g.late-a.g.late).slice(0,6).map(x=>`<tr><td>${esc(x.g.name)}</td><td>${esc(x.t.name)}</td><td class="n">${x.g.days}</td><td class="n">${usd(x.g.late,2)}</td></tr>`).join('');
  const wf=(l,v,cls)=>`<tr><td>${l}</td><td class="n ${cls||''}">${v}</td></tr>`;
  return head(L('כספים','Finance'),pillF(L('חדש','New'),'green'))+`<p class="muted">${L('כל הטיולים שהוזמנו במקום אחד, בדולרים. הצעות נחשבות צנרת ולעולם לא הכנסה.','All booked trips in one place, in dollars. Quotes count as pipeline, never as revenue.')}</p>${filt}
  <div class="stats"><div class="stat"><div class="l">${L('הכנסות מוזמנות','Booked revenue')}</div><div class="v">${usd(P.rev)}</div><div class="s">${L(`${P.rows.length} טיולים, ${P.pax} נוסעים`,`${P.rows.length} trips, ${P.pax} travelers`)}</div></div><div class="stat"><div class="l">${L('רווח מתוכנן','Planned profit')}</div><div class="v">${usd(P.pp)}</div><div class="s">${pct(P.pp/P.rev)}</div></div>
   <div class="stat"><div class="l">${L('רווח צפוי','Expected profit')}</div><div class="v">${usd(P.fp)}</div><div class="s ${P.fp<P.pp?'neg':'pos'}">${pct(P.fp/P.rev)} | ${sgn(r2(P.fp-P.pp),usd)} ${L('מול תכנון','vs plan')}</div></div><div class="stat"><div class="l">${L('רווח לנוסע','Profit per traveler')}</div><div class="v">${usd(P.fp/P.pax)}</div><div class="s">${L('צפוי','Expected')}</div></div>
   <div class="stat"><div class="l">${L('חייבים','Receivable')}</div><div class="v">${usd(P.outstanding)}</div><div class="s">${usd(P.late)} ${L('באיחור','late')}</div></div><div class="stat"><div class="l">${L('עמלות ספקים','Supplier commission')}</div><div class="v">${usd(P.comm)}</div><div class="s">${L('לא מוצגות ללקוחות','not shown to clients')}</div></div></div>
  <div class="card sec"><h3>${L('רווח מתוכנן מול צפוי, לפי טיול','Planned vs expected profit, by trip')}</h3><div class="legend"><span><i style="background:var(--muted);opacity:.55"></i>${L('מתוכנן','Planned')}</span><span><i style="background:var(--teal)"></i>${L('צפוי','Expected')}</span></div><div class="scroll"><div class="chart">${bars}</div><div class="xl">${labs}</div></div></div>
  <div class="two"><div class="card"><h3>${L('מרווח מתוכנן לרווח צפוי','From planned to expected profit')}</h3><table class="tbl"><tbody>${wf(L('רווח מתוכנן','Planned profit'),usd(P.pp,2))}${wf(L('סכומי ספקים מעל או מתחת להצעה','Supplier amounts above or below quote'),usd(-P.amtDiff,2),P.amtDiff>0?'neg':'pos')}${wf(L('שער ששולם מול שער נעול','Rate paid vs locked rate'),usd(-P.fx,2),P.fx>0?'neg':'pos')}</tbody><tfoot><tr><td>${L('רווח צפוי','Expected profit')}</td><td class="n">${usd(P.fp,2)}</td></tr></tfoot></table><p class="small muted" style="margin-top:8px">${L(`${P.gapN} חשבוניות שונות מההצעה, ו-${P.noneN} שורות ספק בלי חשבונית.`,`${P.gapN} invoices differ from the quote, and ${P.noneN} supplier lines have no invoice yet.`)} <a href="#" data-act="go" data-v="gaps" style="color:var(--blue)">${L('לבקרת החשבוניות','Open invoice check')}</a></p></div>
  <div class="card"><h3>${L('איחורים בתשלומי לקוחות','Late client payments')}</h3><table class="tbl"><thead><tr><th>${L('ימי איחור','Days late')}</th><th class="n">${L('קבוצות','Groups')}</th><th class="n">${L('סכום','Amount')}</th></tr></thead><tbody>${agL}</tbody><tfoot><tr><td>${L('סה"כ','Total')}</td><td class="n">${P.lateN}</td><td class="n">${usd(P.late)}</td></tr></tfoot></table>
   ${late?`<div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>${L('משק בית','Household')}</th><th>${L('טיול','Trip')}</th><th class="n">${L('ימים','Days')}</th><th class="n">${L('באיחור','Late')}</th></tr></thead><tbody>${late}</tbody></table></div>`:''}</div></div>
  <div class="card sec"><h3>${L('תזרים ל-12 חודשים','12-month cash flow')}</h3><p class="small muted">${L('תשלומי לקוחות צפויים מול תשלומי ספקים שנותרו. פיגורים נספרים בחודש הנוכחי. ספקים משולמים 14 יום לפני היציאה, או בעוד 20 יום בטיולים שחזרו.','Expected client payments against supplier payments still due. Late items count in the current month. Suppliers are paid 14 days before departure, or in 20 days for trips already back.')}</p>
   <div class="legend"><span><i style="background:#22a06b"></i>${L('מלקוחות','From clients')} ${usd(inT)}</span><span><i style="background:#e07a5f"></i>${L('לספקים','To suppliers')} ${usd(outT)}</span><span>${L('נטו','Net')} ${sgn(r2(inT-outT),usd)}</span></div><div class="scroll"><div class="chart">${cbars}</div><div class="xl">${clabs}</div></div></div>
  <div class="two"><div class="card"><h3>${L('תרחיש שער חליפין','Exchange-rate scenario')}</h3><p class="small muted">${L('רוב הספקים מחייבים בדולרים. אם היורו, הליש"ט או הדולר הקנדי יתחזקו לפני התשלום, זו ההשפעה על הרווח הצפוי.','Most suppliers bill in USD. If the euro, pound or Canadian dollar strengthen before you pay, this is the effect on expected profit.')}</p>
   <div class="row"><input type="range" min="-10" max="10" step="1" value="${S.shock}" data-in="shock" aria-label="${L('שינוי מטבע באחוזים','Currency move, percent')}"><strong style="direction:ltr">${sgn(S.shock,v=>v)}%</strong></div>
   ${fxk.length?`<table class="tbl" style="margin-top:8px"><thead><tr><th>${L('מטבע','Currency')}</th><th class="n">${L('נותר לשלם','Still to pay')}</th><th class="n">${L('בשער נעול','At locked rate')}</th><th class="n">${L('השפעה על הרווח','Profit effect')}</th></tr></thead><tbody>${fx}</tbody><tfoot><tr><td colspan="3">${L('סה"כ השפעה','Total effect')}</td><td class="n ${fxTot>0?'neg':'pos'}">${sgn(-fxTot,usd)}</td></tr></tfoot></table>`:`<p class="muted">${L('אין חשיפה במטבע זר בסינון הזה.','No foreign-currency exposure in this filter.')}</p>`}

function parseRow(r){
  const raw=String(r[1]).trim(),note=String(r[2]||''),cat=CATS.find(c=>c[0].test(r[0]))[1];
  if(!raw||/^[—–-]+$/.test(raw))return {item:r[0],cat,ok:false,flag:L('אין מחיר בקובץ. יש לשאול את הספק.','No price in the file. Ask the supplier.')};
  let s=raw.match(/\d[\d.,]*/)[0];s=/^\d{1,3},\d{3}/.test(s)?s.replace(/,/g,''):s.replace(',','.');const num=parseFloat(s);
  const cur=/€|eur/i.test(raw)?'EUR':/\$|usd/i.test(raw)?'USD':null,per=/pp|per person/i.test(raw);
  let v=num,flag='';
  if(cur==='EUR'){v=r2(num*BASE_RATE.EUR);flag=L('מחיר ביורו, הומר לדולר בשער 1.08. לאשר מול הספק.','Price in EUR, converted to USD at 1.08. Confirm with the supplier.');}
  else if(!cur)flag=L('מטבע לא צוין. הונח דולר, צריך בדיקה.','Currency not stated. Assumed USD, needs a check.');
  if(/tax/i.test(note))flag=(flag?flag+' ':'')+L('מס לא כלול, להוסיף 12.6%.','Tax not included; add 12.6%.');
